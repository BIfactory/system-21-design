<!doctype html>
<html lang="cs" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>System 21 · Knowledge base</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../tokens/tokens.css">
<link rel="stylesheet" href="../dist/system21.css">
<script>(function(){try{var b=localStorage.getItem('system21-brand');if(b&&b!=='bifactory')document.documentElement.setAttribute('data-brand',b);var t=localStorage.getItem('system21-theme');if(t==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
<script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="../dist/system21.js"></script>
<script src="./_shared.js"></script>
</head>
<body>
<div id="root"></div>
<script>
(() => {
  const S = window.S21, D = window.S21Demo, e = React.createElement;

  const CATEGORIES = [
    { id: "all", label: "Všechny", icon: "notes", count: 24 },
    { id: "onboarding", label: "Onboarding", icon: "user-plus", count: 5 },
    { id: "procesy", label: "Procesy", icon: "refresh", count: 8 },
    { id: "produkty", label: "Produkty pojištění", icon: "folder", count: 7 },
    { id: "it", label: "IT a systémy", icon: "settings", count: 4 },
  ];

  const ARTICLES = [
    { id: 1, category: "onboarding", title: "První týden v týmu", author: "Lubomír Hulín", updated: "15. 10. 2026", reading: "3 min", views: 42, tags: ["Onboarding", "Nováček"] },
    { id: 2, category: "procesy", title: "Proces zpracování pojistné události", author: "Alena Dvořáková", updated: "08. 10. 2026", reading: "7 min", views: 128, tags: ["Pojistná událost", "Likvidace"] },
    { id: 3, category: "produkty", title: "Produkty Allianz — porovnání s UNIQA", author: "Pavel Obdržálek", updated: "02. 10. 2026", reading: "12 min", views: 87, tags: ["Allianz", "UNIQA", "Porovnání"] },
    { id: 4, category: "procesy", title: "Jak napárovat dokument ke klientovi", author: "Tomáš Novák", updated: "28. 09. 2026", reading: "4 min", views: 64, tags: ["DMS", "Automatizace"] },
    { id: 5, category: "produkty", title: "Nová úrazová pojistka 2027 — brief", author: "Pavel Obdržálek", updated: "25. 09. 2026", reading: "5 min", views: 39, tags: ["Produkt 2027", "Úraz"] },
    { id: 6, category: "it", title: "Napojení Gmailu na System 21", author: "Marek Krejčí", updated: "20. 09. 2026", reading: "3 min", views: 23, tags: ["Integrace", "Gmail"] },
    { id: 7, category: "onboarding", title: "Jak nastavit brand pro nového zákazníka", author: "Lubomír Hulín", updated: "18. 09. 2026", reading: "10 min", views: 15, tags: ["Multi-brand", "Nastavení"] },
    { id: 8, category: "procesy", title: "Checklist před podpisem smlouvy", author: "Alena Dvořáková", updated: "12. 09. 2026", reading: "2 min", views: 94, tags: ["Smlouva", "Checklist"] },
  ];

  const POPULAR = ARTICLES.slice().sort((a, b) => b.views - a.views).slice(0, 3);

  const CRUMBS = [{ label: "Intranet", href: "/intranet" }, { label: "Knowledge base", href: "/kb" }];

  function Page() {
    const [cat, setCat] = React.useState("all");
    const [q, setQ] = React.useState("");
    const rows = cat === "all" ? ARTICLES : ARTICLES.filter((a) => a.category === cat);
    const filtered = !q ? rows : rows.filter((a) => (a.title + " " + a.tags.join(" ")).toLowerCase().includes(q.toLowerCase()));

    return e(S.AppShell, {
      sidebar: e(D.DemoSidebar, { active: "/kb" }),
      topbar: e(D.DemoTopBar, { crumbs: CRUMBS }),
    },
      e(S.PageHeader, {
        title: "Knowledge base",
        description: "Interní dokumentace, postupy, šablony, FAQ",
        actions: e(S.Button, { icon: "plus" }, "Nový článek")
      }),
      e(S.PageBody, null,
        e("div", { style: { display: "grid", gridTemplateColumns: "220px 1fr", gap: "var(--space-4)", alignItems: "start" } },
          e("aside", { style: { background: "var(--surface-raised)", border: "1px solid var(--border)", borderRadius: "var(--radius-xl)", padding: "var(--space-2)" } },
            e("nav", { "aria-label": "Kategorie" },
              CATEGORIES.map((c) => e("button", {
                key: c.id, type: "button",
                onClick: () => setCat(c.id),
                style: {
                  display: "flex", alignItems: "center", gap: "var(--space-2)",
                  width: "100%", padding: "var(--space-2)",
                  background: cat === c.id ? "var(--primary-soft)" : "transparent",
                  border: 0, borderRadius: "var(--radius-md)",
                  color: cat === c.id ? "var(--primary-text)" : "var(--ink)",
                  font: cat === c.id ? "600 13px/18px var(--font-body)" : "400 13px/18px var(--font-body)",
                  cursor: "pointer", textAlign: "left"
                }
              },
                e(S.Icon, { name: c.icon, size: 14 }),
                e("span", { style: { flex: 1 } }, c.label),
                e("span", { style: { font: "500 11px/16px var(--font-mono)", color: "var(--ink-muted)" } }, c.count)
              ))
            )
          ),
          e("div", { style: { display: "flex", flexDirection: "column", gap: "var(--space-4)" } },
            e(S.FilterBar, null,
              e(S.SearchInput, { className: "s21-grow", value: q, onChange: setQ, placeholder: "Hledat článek, tag, autor…" }),
              e(S.Select, { placeholder: "Nejnovější", options: [
                { value: "new", label: "Nejnovější" }, { value: "popular", label: "Nejoblíbenější" }, { value: "views", label: "Nejvíc čtené" }
              ] })
            ),
            cat === "all" && !q && e(S.Section, { title: "Nejoblíbenější" },
              e("div", { style: { display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(280px, 1fr))", gap: "var(--space-3)" } },
                POPULAR.map((a) => e(S.EntityCard, {
                  key: a.id,
                  icon: "star",
                  accent: "primary",
                  title: a.title,
                  subtitle: a.author + " · " + a.reading,
                  meta: [
                    { label: "Zobrazení", value: a.views },
                    { label: "Aktualizace", value: a.updated },
                  ],
                  tags: a.tags.slice(0, 2).map((t) => ({ label: t, tone: "neutral" })),
                  onClick: () => {}
                }))
              )
            ),
            e(S.Section, { title: cat === "all" ? "Všechny články" : CATEGORIES.find((c) => c.id === cat).label },
              e("div", { style: { display: "flex", flexDirection: "column", gap: "var(--space-2)" } },
                filtered.map((a) => e(S.EntityCard, {
                  key: a.id,
                  icon: "notes",
                  title: a.title,
                  subtitle: a.author + " · " + a.updated + " · " + a.reading,
                  tags: a.tags.map((t) => ({ label: t, tone: "neutral" })),
                  actions: e("span", { style: { font: "500 11px/14px var(--font-mono)", color: "var(--ink-muted)" } },
                    a.views + " zobrazení"
                  ),
                  onClick: () => {}
                })),
                filtered.length === 0 && e(S.EmptyState, { title: "Nic nenalezeno", description: "Zkus upravit hledání nebo vybrat jinou kategorii." })
              )
            )
          )
        )
      )
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(e(Page));
})();
</script>
</body>
</html>
