<!doctype html>
<html lang="cs" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>System 21 · SM-2026-0117</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../tokens/tokens.css">
<link rel="stylesheet" href="../dist/system21.css">
<script>(function(){try{var b=localStorage.getItem('system21-brand');if(b&&b!=='bifactory')document.documentElement.setAttribute('data-brand',b);var t=localStorage.getItem('system21-theme');if(t==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
<script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="../dist/system21.js"></script>
<script src="./_shared.js"></script>
</head>
<body>
<div id="root"></div>
<script>
(() => {
  const S = window.S21, D = window.S21Demo, e = React.createElement;

  const FILES = [
    { id: 1, name: "Smlouva o pojištění 2026.pdf", mimeType: "application/pdf", size: 243_200, uploadedBy: "Pavel O.", uploadedAt: "před 3 h" },
    { id: 2, name: "Dodatek č. 1.pdf", mimeType: "application/pdf", size: 86_400, uploadedBy: "Pavel O.", uploadedAt: "před 5 dny" },
    { id: 3, name: "Fotodokumentace majetku.jpg", mimeType: "image/jpeg", size: 2_480_000, uploadedBy: "Jan Novák", uploadedAt: "včera" },
  ];
  const COMMENTS = [
    { id: 1, author: "Pavel Obdržálek", text: "Smlouva je připravená k podpisu. Klient souhlasil s cenou 14 400 Kč.", createdAt: "před 1 d", reactions: { "👍": 2 } },
    { id: 2, author: "Alena Dvořáková", text: "Super. Podpis plánujeme na 20. 11. v kanceláři.", createdAt: "před 2 h" },
  ];
  const RELS = [
    { title: "Klient", count: 1, items: [{ icon: "users", label: "Novákovi", href: "./crm-klient-detail.html" }] },
    { title: "Další smlouvy", count: 2, items: [{ icon: "file", label: "Úrazové pojištění SM-2025-0233" }, { icon: "file", label: "Autopojištění SM-2026-0089" }] },
    { title: "Úkoly", count: 1, items: [{ icon: "tasks", label: "Zavolat klientovi 19. 11.", meta: "zítra" }] },
  ];
  const CRUMBS = [
    { label: "DMS", href: "/dms" },
    { label: "Smlouvy", href: "/dms/smlouvy" },
    { label: "SM-2026-0117 Pojištění majetku", href: "/dms/smlouvy/117" },
  ];

  function Page() {
    const [tab, setTab] = React.useState("prehled");
    const [comments, setComments] = React.useState(COMMENTS);
    const [sendOpen, setSendOpen] = React.useState(false);
    const [deleteOpen, setDeleteOpen] = React.useState(false);
    const [sendTo, setSendTo] = React.useState("jan.novak@novak.cz");
    const [sendNote, setSendNote] = React.useState("Dobrý den, zasílám smlouvu k podpisu. S pozdravem Pavel");
    const [data, setData] = React.useState({
      pojistitel: "Allianz pojišťovna",
      pojistnik: "Jan Novák",
      platnost: "12. 04. 2024 – 12. 04. 2027",
      frekvence: "rocne",
      pojistne: "14 400 Kč",
      objekt: "Rodinný dům, Zlín-Malenovice",
    });
    const updateField = (k) => (v) => setData((prev) => ({ ...prev, [k]: v }));
    return e(S.AppShell, {
      sidebar: e(D.DemoSidebar, { active: "/dms/smlouvy" }),
      topbar: e(D.DemoTopBar, { crumbs: CRUMBS, onNavigate: (it, i) => { if (i === 1) window.location.href = "./dms-smlouvy.html"; } }),
    },
      e(S.PageHeader, {
        title: "SM-2026-0117 Pojištění majetku",
        description: "Novákovi · Allianz · Pojistné " + data.pojistne + " / rok",
        actions: e(React.Fragment, null,
          e(S.WorkflowBadge, { state: "in-progress" }),
          e(S.Button, { variant: "secondary", icon: "download" }, "Stáhnout"),
          e(S.Button, { icon: "send", onClick: () => setSendOpen(true) }, "Odeslat k podpisu"),
          e(S.DropdownMenu, {
            trigger: e(S.Button, { variant: "secondary", iconOnly: true, icon: "more", "aria-label": "Další akce" })
          }, ({ close }) =>
            e("button", { type: "button", role: "menuitem", className: "s21-dd__item s21-dd__item--btn", onClick: () => { close(); setDeleteOpen(true); } },
              e("span", { className: "s21-dd__itemmain" },
                e(S.Icon, { name: "trash", size: 14 }),
                "Smazat smlouvu"
              )
            )
          )
        ),
        tabs: e(S.Tabs, { value: tab, onChange: setTab, items: [
          { value: "prehled", label: "Přehled" },
          { value: "komentare", label: "Komentáře", count: 2 },
          { value: "historie", label: "Historie" },
          { value: "soubory", label: "Soubory", count: 3 },
        ] })
      }),
      e(S.PageBody, null,
        e("div", { style: { display: "grid", gridTemplateColumns: "1fr 320px", gap: "var(--space-5)", alignItems: "start" } },
          e("div", { style: { display: "flex", flexDirection: "column", gap: "var(--space-5)" } },
            e(S.Section, { title: "Údaje" },
              e("dl", { className: "s21-entity__meta", style: { display: "grid", gridTemplateColumns: "max-content 1fr", gap: "4px 24px" } },
                e("dt", null, "Pojistitel"), e("dd", null, e(S.InlineEditor, { value: data.pojistitel, onSave: updateField("pojistitel"), label: "pojistitel" })),
                e("dt", null, "Pojistník"), e("dd", null, e(S.InlineEditor, { value: data.pojistnik, onSave: updateField("pojistnik"), label: "pojistník" })),
                e("dt", null, "Platnost"), e("dd", null, e(S.InlineEditor, { value: data.platnost, onSave: updateField("platnost"), label: "platnost" })),
                e("dt", null, "Frekvence"), e("dd", null, e(S.InlineEditor, {
                  value: data.frekvence,
                  type: "select",
                  onSave: updateField("frekvence"),
                  label: "frekvence",
                  options: [
                    { value: "mesicne", label: "Měsíčně" },
                    { value: "ctvrtletne", label: "Čtvrtletně" },
                    { value: "rocne", label: "Ročně" },
                    { value: "jednorazove", label: "Jednorázově" },
                  ],
                  display: (v) => ({ mesicne: "Měsíčně", ctvrtletne: "Čtvrtletně", rocne: "Ročně", jednorazove: "Jednorázově" }[v] || v),
                })),
                e("dt", null, "Pojistné"), e("dd", null, e(S.InlineEditor, { value: data.pojistne, onSave: updateField("pojistne"), label: "pojistné" })),
                e("dt", null, "Objekt"), e("dd", null, e(S.InlineEditor, { value: data.objekt, onSave: updateField("objekt"), type: "textarea", label: "objekt" }))
              )
            ),
            e(S.Section, { title: "Soubory" },
              e("div", { style: { display: "flex", flexDirection: "column", gap: "var(--space-3)" } },
                e(S.FileUploadZone, { onFiles: (files) => new Promise((res) => setTimeout(res, 800)), accept: ".pdf,.jpg,.png,.doc,.docx", maxSize: 10 * 1024 * 1024 }),
                e(S.AttachmentList, { items: FILES, onDownload: () => {} })
              )
            ),
            e(S.Section, { title: "Komentáře" },
              e(S.CommentThread, {
                items: comments,
                currentUser: { name: "Lubomír Hulín" },
                onAdd: (text) => setComments([...comments, { id: Date.now(), author: "Lubomír Hulín", text, createdAt: "právě teď" }]),
              })
            )
          ),
          e(S.RelationsSidebar, { sections: RELS })
        ),
        e(S.QuickActionModal, {
          open: sendOpen, onClose: () => setSendOpen(false),
          title: "Odeslat k podpisu",
          description: "Smlouva SM-2026-0117 bude odeslána e-mailem klientovi.",
          icon: "send",
          footer: e(React.Fragment, null,
            e(S.Button, { variant: "secondary", onClick: () => setSendOpen(false) }, "Zrušit"),
            e(S.Button, { icon: "send", onClick: () => setSendOpen(false) }, "Odeslat")
          )
        },
          e("div", { style: { display: "flex", flexDirection: "column", gap: "var(--space-3)" } },
            e(S.Field, { label: "Příjemce" },
              e(S.Input, { value: sendTo, onChange: setSendTo, type: "email" })
            ),
            e(S.Field, { label: "Zpráva" },
              e("div", { style: { display: "flex", flexDirection: "column", gap: "var(--space-2)" } },
                e(S.Textarea, { value: sendNote, onChange: setSendNote, rows: 4 }),
                e("div", { style: { display: "flex", justifyContent: "flex-end" } },
                  e(S.AIInputHelper, {
                    value: sendNote,
                    onSelect: setSendNote,
                    label: "Vylepšit s AI",
                    onGenerate: () => new Promise((res) => setTimeout(() => res([
                      "Dobrý den, zasílám smlouvu k podpisu. V případě dotazů jsem k dispozici. S pozdravem Pavel",
                      "Dobrý den, posílám vám připravenou smlouvu. Prosím, dejte vědět, jestli všechno odpovídá domluvě. S pozdravem Pavel Obdržálek",
                      "Dobrý den, smlouvu máme hotovou — v příloze. Pokud by bylo co upravit, dejte vědět. Děkuji, Pavel",
                    ]), 700))
                  })
                )
              )
            )
          )
        ),
        e(S.Modal, {
          open: deleteOpen, onClose: () => setDeleteOpen(false),
          destructive: true,
          title: "Smazat smlouvu?",
          description: "Smlouva SM-2026-0117 Pojištění majetku bude trvale odstraněna včetně příloh (3) a komentářů (" + comments.length + "). Tuto akci nelze vzít zpět.",
          footer: e(React.Fragment, null,
            e(S.Button, { variant: "secondary", onClick: () => setDeleteOpen(false) }, "Zrušit"),
            e(S.Button, { variant: "danger", icon: "trash", onClick: () => setDeleteOpen(false) }, "Smazat trvale")
          )
        })
      )
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(e(Page));
})();
</script>
</body>
</html>
