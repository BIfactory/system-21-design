<!doctype html>
<html lang="cs" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>System 21 · ZAK-2026-0131</title>
<link rel="stylesheet" href="../tokens/tokens.css">
<link rel="stylesheet" href="../dist/system21.css">
<script>(function(){try{var b=localStorage.getItem('system21-brand');if(b&&b!=='bifactory')document.documentElement.setAttribute('data-brand',b);var t=localStorage.getItem('system21-theme');if(t==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
<script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="../dist/system21.js"></script>
<script src="./_shared.js"></script>
</head>
<body>
<div id="root"></div>
<script>
(() => {
  const S = window.S21, D = window.S21Demo, e = React.createElement;

  const OPERATIONS = [
    { id: 1, code: "OP-07", name: "Mapování dat z CRM", owner: "Pavel O.", hours: "8/12", state: "in-progress", deadline: "25. 11." },
    { id: 2, code: "OP-08", name: "Setup pipeline", owner: "Alena D.", hours: "4/6", state: "in-progress", deadline: "27. 11." },
    { id: 3, code: "OP-09", name: "Testy integrace", owner: "Tomáš N.", hours: "0/8", state: "draft", deadline: "02. 12." },
    { id: 4, code: "OP-10", name: "Dokumentace", owner: "Pavel O.", hours: "2/4", state: "in-progress", deadline: "04. 12." },
    { id: 5, code: "OP-06", name: "Analýza požadavků", owner: "Pavel O.", hours: "16/16", state: "done", deadline: "15. 11." },
    { id: 6, code: "OP-05", name: "Workshop s klientem", owner: "Pavel O.", hours: "4/4", state: "done", deadline: "08. 11." },
  ];

  const OP_COLUMNS = [
    { key: "code", label: "Op.", width: "8%", render: (o) => e("span", { className: "s21-cell-code" }, o.code) },
    { key: "name", label: "Operace", sortable: true, width: "40%", render: (o) =>
      e("div", null,
        e("div", { className: "s21-cell-title" }, o.name),
        e("div", { className: "s21-cell-meta" }, o.owner)
      )
    },
    { key: "hours", label: "Hodiny", align: "right", numeric: true, width: "12%" },
    { key: "deadline", label: "Deadline", align: "right", numeric: true, width: "14%" },
    { key: "state", label: "Stav", width: "14%", render: (o) => e(S.WorkflowBadge, { state: o.state, fitCell: true }) },
    { key: "actions", label: "", align: "center", width: "12%", render: (o, ctx) =>
      e("span", { className: "s21-row-actions", "data-no-row-click": true },
        e(S.Button, { size: "sm", iconOnly: true, icon: "clock", variant: "ghost", "aria-label": "Vykázat hodiny", title: "Vykázat hodiny", onClick: (ev) => { ev.stopPropagation(); ctx.openLog(o); } }),
        e(S.Button, { size: "sm", iconOnly: true, icon: "more", variant: "ghost", "aria-label": "Víc", title: "Víc" })
      )
    }
  ];

  const COMMENTS = [
    { id: 1, author: "Pavel Obdržálek", text: "Klient potvrdil scope. Pokračujeme dle plánu.", createdAt: "před 2 d", reactions: { "👍": 2 } },
    { id: 2, author: "Alena Dvořáková", text: "Schválila jsem rozpočet. Můžeme pokračovat s OP-08.", createdAt: "před 1 d" },
    { id: 3, author: "Tomáš Novák", text: "Příprava testovacího prostředí hotová.", createdAt: "před 3 h" },
  ];

  const FILES = [
    { id: 1, name: "Zadání od klienta.pdf", mimeType: "application/pdf", size: 280_000, uploadedBy: "Pavel O.", uploadedAt: "před týdnem" },
    { id: 2, name: "Pipeline diagram.png", mimeType: "image/png", size: 1_240_000, uploadedBy: "Alena D.", uploadedAt: "před 3 dny" },
    { id: 3, name: "Rozpočet.xlsx", mimeType: "application/vnd.ms-excel", size: 62_000, uploadedBy: "Alena D.", uploadedAt: "před 2 dny" },
  ];

  const RELS = [
    { title: "Klient", count: 1, items: [{ icon: "building", label: "Agro Slovácko s.r.o.", href: "./crm-klient-detail.html" }] },
    { title: "Další zakázky klienta", count: 3, items: [
      { icon: "folder", label: "ZAK-2026-0128 Konzultace" },
      { icon: "folder", label: "ZAK-2026-0089 Audit procesů" },
      { icon: "folder", label: "ZAK-2025-0041 Školení týmu" }
    ] },
    { title: "Kontakty", count: 2, items: [
      { icon: "user", label: "Ing. Vlastimil Kříž", meta: "jednatel" },
      { icon: "user", label: "Markéta Vondráková", meta: "provozní" }
    ] },
  ];

  const CRUMBS = [
    { label: "Zakázky", href: "/zakazky" },
    { label: "ZAK-2026-0131 Napojení ERP → CRM", href: "/zakazky/131" },
  ];

  function Page() {
    const [tab, setTab] = React.useState("realizace");
    const [comments, setComments] = React.useState(COMMENTS);
    const [selected, setSelected] = React.useState([]);
    const [logOpen, setLogOpen] = React.useState(false);
    const [logOp, setLogOp] = React.useState(null);
    const [logHours, setLogHours] = React.useState("2");
    const [logNote, setLogNote] = React.useState("");
    const [cancelOpen, setCancelOpen] = React.useState(false);
    const [data, setData] = React.useState({
      klient: "Agro Slovácko s.r.o.",
      deadline: "2026-12-10",
      hodnota: "312 000 Kč",
      vlastnik: "pavel",
      stav: "in-progress",
    });
    const updateField = (k) => (v) => setData((prev) => ({ ...prev, [k]: v }));
    const openLog = (op) => { setLogOp(op); setLogHours(""); setLogNote(""); setLogOpen(true); };

    return e(S.AppShell, {
      sidebar: e(D.DemoSidebar, { active: "/zakazky" }),
      topbar: e(D.DemoTopBar, { crumbs: CRUMBS, onNavigate: (it, i) => { if (i === 0) window.location.href = "./index.html"; } }),
    },
      e(S.PageHeader, {
        title: "ZAK-2026-0131 Napojení ERP → CRM",
        description: data.klient + " · Vlastník: Pavel Obdržálek · Deadline: " + new Date(data.deadline).toLocaleDateString("cs-CZ"),
        actions: e(React.Fragment, null,
          e(S.WorkflowBadge, { state: data.stav }),
          e(S.Button, { variant: "secondary", icon: "clock", onClick: () => openLog({ code: "ZAK-2026-0131", name: "Vykázat na zakázku" }) }, "Vykázat"),
          e(S.Button, { variant: "secondary", icon: "trash", onClick: () => setCancelOpen(true) }, "Zrušit zakázku"),
          e(S.Button, { icon: "check" }, "Označit hotové")
        ),
        tabs: e(S.Tabs, { value: tab, onChange: setTab, items: [
          { value: "realizace", label: "Realizace" },
          { value: "plan", label: "Plán" },
          { value: "vykazy", label: "Výkazy", count: 28 },
          { value: "dokumenty", label: "Dokumenty", count: 3 },
          { value: "aktivita", label: "Aktivita" },
        ] })
      }),
      e(S.PageBody, null,
        e("div", { style: { display: "grid", gridTemplateColumns: "1fr 320px", gap: "var(--space-5)", alignItems: "start" } },
          e("div", { style: { display: "flex", flexDirection: "column", gap: "var(--space-5)" } },
            e(S.Section, { title: "Údaje" },
              e("dl", { className: "s21-entity__meta", style: { display: "grid", gridTemplateColumns: "max-content 1fr", gap: "4px 24px" } },
                e("dt", null, "Klient"), e("dd", null, e(S.InlineEditor, { value: data.klient, onSave: updateField("klient"), label: "klient" })),
                e("dt", null, "Deadline"), e("dd", null, e(S.InlineEditor, {
                  value: data.deadline, type: "date", onSave: updateField("deadline"), label: "deadline",
                  display: (v) => v ? new Date(v).toLocaleDateString("cs-CZ", { day: "2-digit", month: "2-digit", year: "numeric" }) : "—"
                })),
                e("dt", null, "Hodnota"), e("dd", null, e(S.InlineEditor, { value: data.hodnota, onSave: updateField("hodnota"), label: "hodnota" })),
                e("dt", null, "Stav"), e("dd", null, e(S.InlineEditor, {
                  value: data.stav, type: "select", onSave: updateField("stav"), label: "stav",
                  options: [
                    { value: "draft", label: "Rozpracováno" },
                    { value: "offer", label: "Nabídka" },
                    { value: "negotiation", label: "V jednání" },
                    { value: "in-progress", label: "Realizace" },
                    { value: "done", label: "Hotovo" },
                  ],
                  display: (v) => e(S.WorkflowBadge, { state: v, fitCell: true })
                }))
              )
            ),
            e(S.Section, { title: "Operace", action: e(S.Button, { size: "sm", icon: "plus" }, "Nová operace") },
              e(S.DataTable, {
                columns: OP_COLUMNS.map((c) => c.key === "actions" ? { ...c, render: (o) => c.render(o, { openLog }) } : c),
                rows: OPERATIONS,
                onRowClick: () => {},
                minWidth: 820,
                selectable: true,
                selected,
                onSelectedChange: setSelected,
              })
            ),
            e(S.Section, { title: "Soubory" },
              e("div", { style: { display: "flex", flexDirection: "column", gap: "var(--space-3)" } },
                e(S.FileUploadZone, { onFiles: (files) => new Promise((res) => setTimeout(res, 800)), accept: ".pdf,.jpg,.png,.doc,.docx,.xlsx", maxSize: 10 * 1024 * 1024 }),
                e(S.AttachmentList, { items: FILES, onDownload: () => {} })
              )
            ),
            e(S.Section, { title: "Komentáře" },
              e(S.CommentThread, {
                items: comments,
                currentUser: { name: "Lubomír Hulín" },
                onAdd: (text) => setComments([...comments, { id: Date.now(), author: "Lubomír Hulín", text, createdAt: "právě teď" }]),
              })
            )
          ),
          e(S.RelationsSidebar, { sections: RELS })
        ),
        // Quick action modal — Vykázat hodiny
        e(S.QuickActionModal, {
          open: logOpen, onClose: () => setLogOpen(false),
          title: "Vykázat hodiny",
          description: logOp ? (logOp.code + " · " + logOp.name) : "",
          icon: "clock",
          footer: e(React.Fragment, null,
            e(S.Button, { variant: "secondary", onClick: () => setLogOpen(false) }, "Zrušit"),
            e(S.Button, { icon: "check", onClick: () => setLogOpen(false) }, "Uložit")
          )
        },
          e("div", { style: { display: "flex", flexDirection: "column", gap: "var(--space-3)" } },
            e(S.Field, { label: "Počet hodin" },
              e(S.Input, { value: logHours, onChange: setLogHours, type: "number", placeholder: "např. 2" })
            ),
            e(S.Field, { label: "Datum" },
              e(S.Input, { type: "date", value: new Date().toISOString().slice(0,10), onChange: () => {} })
            ),
            e(S.Field, { label: "Poznámka" },
              e(S.Textarea, { value: logNote, onChange: setLogNote, placeholder: "Co jsi dnes udělal?" })
            )
          )
        ),
        // Destructive modal — Zrušit zakázku
        e(S.Modal, {
          open: cancelOpen, onClose: () => setCancelOpen(false),
          destructive: true,
          title: "Zrušit zakázku?",
          description: "Zakázka ZAK-2026-0131 bude označena jako zrušená. 4 nevykázané operace a " + comments.length + " komentářů zůstanou pro audit, ale zakázka se přesune mimo aktivní pohled.",
          footer: e(React.Fragment, null,
            e(S.Button, { variant: "secondary", onClick: () => setCancelOpen(false) }, "Nerušit"),
            e(S.Button, { variant: "danger", icon: "x", onClick: () => setCancelOpen(false) }, "Zrušit zakázku")
          )
        }),
        // Bulk action bar for selected operations
        e(S.BulkActionBar, {
          count: selected.length,
          label: "operací vybráno",
          onClear: () => setSelected([]),
          actions: [
            { label: "Označit hotové", icon: "check", onClick: () => setSelected([]) },
            { label: "Přesunout", icon: "folder", onClick: () => {} },
            { label: "Smazat", icon: "trash", variant: "danger", onClick: () => {} },
          ]
        })
      )
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(e(Page));
})();
</script>
</body>
</html>
