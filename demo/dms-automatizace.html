<!doctype html>
<html lang="cs" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>System 21 · DMS Automatizace</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../tokens/tokens.css">
<link rel="stylesheet" href="../dist/system21.css">
<script>(function(){try{var b=localStorage.getItem('system21-brand');if(b&&b!=='bifactory')document.documentElement.setAttribute('data-brand',b);var t=localStorage.getItem('system21-theme');if(t==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
<script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="../dist/system21.js"></script>
<script src="./_shared.js"></script>
<style>
  .conf-pill { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: var(--radius-full); font: 600 11px/16px var(--font-mono); letter-spacing: .04em; font-variant-numeric: tabular-nums; }
  .conf-high { background: var(--success-bg); color: var(--success-text); }
  .conf-mid { background: var(--warning-bg); color: var(--warning-text); }
  .conf-low { background: var(--danger-bg); color: var(--danger-text); }
  .status-pill { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: var(--radius-full); font: 500 11px/16px var(--font-mono); letter-spacing: .04em; white-space: nowrap; }
  .status-auto { background: var(--success-bg); color: var(--success-text); }
  .status-review { background: var(--warning-bg); color: var(--warning-text); }
  .status-fail { background: var(--danger-bg); color: var(--danger-text); }
  .inbox-config { padding: var(--space-3) var(--space-4); background: var(--surface-raised); border: 1px solid var(--border); border-radius: var(--radius-xl); display: flex; align-items: center; gap: var(--space-3); }
  .inbox-config__ic { width: 36px; height: 36px; border-radius: var(--radius-full); background: var(--primary-soft); color: var(--primary-text); display: inline-flex; align-items: center; justify-content: center; }
  .field-row { display: grid; grid-template-columns: max-content 1fr auto; gap: var(--space-3); align-items: center; padding: var(--space-2) var(--space-3); border-bottom: 1px solid var(--border-subtle); }
  .field-row:last-child { border-bottom: 0; }
  .field-row__label { font: 500 11px/16px var(--font-mono); letter-spacing: .04em; text-transform: uppercase; color: var(--ink-muted); }
  .field-row__value { font: 500 14px/20px var(--font-body); color: var(--ink); font-variant-numeric: tabular-nums; }
  .email-head { padding: var(--space-3); background: var(--surface-muted); border-radius: var(--radius-lg); font: 400 13px/18px var(--font-body); }
  .email-head__from { font-weight: 600; color: var(--ink); }
  .email-head__subj { font-weight: 600; color: var(--ink); margin-top: 6px; }
  .email-head__meta { color: var(--ink-muted); font-size: 12px; margin-top: 4px; }
  .attach-pill { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-full); font: 500 12px/16px var(--font-body); color: var(--ink); }
  .attach-pill__type { font: 500 10px/14px var(--font-mono); color: var(--primary-text); text-transform: uppercase; letter-spacing: .04em; }
</style>
</head>
<body>
<div id="root"></div>
<script>
(() => {
  const S = window.S21, D = window.S21Demo, e = React.createElement;

  // Poema features.md Scénář 4.3 + 5: 3 statuses, confidence per field.
  // Backend watches pojisteni@poemauh.cz + energie@poemauh.cz
  const EMAILS = [
    { id: 1, status: "auto", from: "info@allianz.cz", subject: "Potvrzení o uzavření smlouvy č. ALZ-2026-12847", received: "dnes 10:42", attachments: [{ name: "Smlouva.pdf", type: "smlouva" }, { name: "Cenik.pdf", type: "ceník" }], inbox: "pojisteni", avgConf: 0.94,
      extracted: {
        "Pojistitel": { value: "Allianz pojišťovna a.s.", conf: 0.99 },
        "Pojistník": { value: "Jan Novák", conf: 0.97 },
        "Rodné číslo": { value: "720514/1234", conf: 0.95 },
        "Číslo smlouvy": { value: "ALZ-2026-12847", conf: 0.98 },
        "Produkt": { value: "Pojištění majetku — rodinný dům", conf: 0.92 },
        "Platnost od": { value: "01. 12. 2026", conf: 0.96 },
        "Platnost do": { value: "01. 12. 2029", conf: 0.94 },
        "Pojistné": { value: "14 800 Kč / rok", conf: 0.91 },
        "Objekt": { value: "Lipová 123, Zlín", conf: 0.78 },
      }
    },
    { id: 2, status: "auto", from: "noreply@uniqa.cz", subject: "Oznámení o výročí smlouvy UQ-23-0098", received: "dnes 09:15", attachments: [{ name: "Vyroci.pdf", type: "smlouva" }], inbox: "pojisteni", avgConf: 0.93,
      extracted: {
        "Pojistitel": { value: "UNIQA pojišťovna", conf: 0.99 },
        "Číslo smlouvy": { value: "UQ-23-0098", conf: 0.98 },
        "Typ oznámení": { value: "Výročí smlouvy", conf: 0.95 },
        "Nové pojistné": { value: "8 400 Kč", conf: 0.89 },
        "Výročí": { value: "15. 02. 2027", conf: 0.92 },
      }
    },
    { id: 3, status: "review", from: "podpora@cpp.cz", subject: "Faktura — autopojištění", received: "dnes 08:30", attachments: [{ name: "Faktura.pdf", type: "faktura" }], inbox: "pojisteni", avgConf: 0.71,
      extracted: {
        "Pojistitel": { value: "ČPP", conf: 0.95 },
        "Pojistník": { value: "? Marie Novák", conf: 0.62 },
        "Číslo smlouvy": { value: "CPP-2026-558", conf: 0.88 },
        "Částka k úhradě": { value: "18 600 Kč", conf: 0.93 },
        "Splatnost": { value: "15. 11. 2026", conf: 0.91 },
        "Variabilní symbol": { value: "558201611", conf: 0.72 },
        "Objekt pojištění": { value: "osobní automobil Škoda Octavia", conf: 0.48 },
      }
    },
    { id: 4, status: "review", from: "info@cez.cz", subject: "Změna ceníku MůjProud 2027", received: "včera 16:24", attachments: [{ name: "Cenik_2027.pdf", type: "ceník" }, { name: "Shrnuti_zmen.pdf", type: "ostatní" }], inbox: "energie", avgConf: 0.68,
      extracted: {
        "Dodavatel": { value: "ČEZ Prodej a.s.", conf: 0.98 },
        "Produkt": { value: "MůjProud 2027", conf: 0.92 },
        "Platnost od": { value: "01. 01. 2027", conf: 0.90 },
        "Dotčené smlouvy": { value: "? vyžaduje ruční kontrolu", conf: 0.35 },
        "Cenová změna": { value: "+3,8 % vs. 2026", conf: 0.72 },
      }
    },
    { id: 5, status: "auto", from: "smlouvy@innogy.cz", subject: "Potvrzení o podpisu smlouvy G-2026-4411", received: "včera 14:12", attachments: [{ name: "Smlouva_plyn.pdf", type: "smlouva" }], inbox: "energie", avgConf: 0.91,
      extracted: {
        "Dodavatel": { value: "innogy Energie s.r.o.", conf: 0.99 },
        "Číslo smlouvy": { value: "G-2026-4411", conf: 0.98 },
        "Zákazník": { value: "Dvořákovi", conf: 0.88 },
        "Komodita": { value: "Plyn", conf: 1.00 },
        "Platnost od": { value: "01. 02. 2027", conf: 0.92 },
        "Konec fixace": { value: "31. 01. 2029", conf: 0.87 },
        "Tarif": { value: "GasiFix 24", conf: 0.90 },
      }
    },
    { id: 6, status: "fail", from: "newsletter@cez.cz", subject: "Zajímavosti z energetiky — podzim 2026", received: "včera 10:00", attachments: [], inbox: "energie", avgConf: 0.12,
      extracted: {
        "Typ": { value: "? newsletter — nic ke zpracování", conf: 0.12 },
      }
    },
    { id: 7, status: "auto", from: "info@allianz.cz", subject: "Dodatek č. 1 — pojištění majetku", received: "pondělí 11:24", attachments: [{ name: "Dodatek.pdf", type: "smlouva" }], inbox: "pojisteni", avgConf: 0.89,
      extracted: {
        "Pojistitel": { value: "Allianz pojišťovna a.s.", conf: 0.99 },
        "Číslo smlouvy": { value: "SM-2024-0117", conf: 0.95 },
        "Typ dokumentu": { value: "Dodatek č. 1", conf: 0.91 },
        "Platnost dodatku od": { value: "15. 09. 2026", conf: 0.88 },
        "Pojistné beze změny": { value: "ano", conf: 0.72 },
      }
    },
    { id: 8, status: "review", from: "generali-obchod@generali.cz", subject: "Nabídka pojištění domu", received: "pondělí 09:18", attachments: [{ name: "Nabidka.pdf", type: "smlouva" }, { name: "Cenik.pdf", type: "ceník" }, { name: "VP.pdf", type: "podmínky" }], inbox: "pojisteni", avgConf: 0.76,
      extracted: {
        "Pojistitel": { value: "Generali Pojišťovna", conf: 0.98 },
        "Typ dokumentu": { value: "Nabídka", conf: 0.94 },
        "Produkt": { value: "? MůjDomov Plus / MůjDomov", conf: 0.52 },
        "Pojistník (navrhovaný)": { value: "? neidentifikováno — ruční", conf: 0.21 },
        "Pojistné": { value: "16 200 Kč / rok", conf: 0.88 },
      }
    },
    { id: 9, status: "fail", from: "spam-marketing@notknown.xyz", subject: "RE: Vaše pojištění vyprší — ověřte údaje", received: "pondělí 07:12", attachments: [], inbox: "pojisteni", avgConf: 0.08,
      extracted: {
        "Typ": { value: "? pravděpodobně phishing", conf: 0.08 },
      }
    },
  ];

  const PENDING = EMAILS.filter((m) => m.status === "review").length;
  const AUTO = EMAILS.filter((m) => m.status === "auto").length;
  const FAIL = EMAILS.filter((m) => m.status === "fail").length;
  const successRate = Math.round(AUTO / (AUTO + PENDING + FAIL) * 100);

  function StatusBadge({ s }) {
    if (s === "auto") return e("span", { className: "status-pill status-auto" }, "Automaticky");
    if (s === "review") return e("span", { className: "status-pill status-review" }, "⚠ Čeká na kontrolu");
    return e("span", { className: "status-pill status-fail" }, "✗ Nezpracovatelné");
  }
  function ConfPill({ v }) {
    const pct = Math.round(v * 100);
    const cls = v >= 0.85 ? "conf-high" : v >= 0.7 ? "conf-mid" : "conf-low";
    return e("span", { className: "conf-pill " + cls }, pct, " %");
  }

  const COLUMNS = [
    { key: "status", label: "", width: "4%", render: (m) =>
      e(S.Icon, { name: m.status === "auto" ? "check-circle" : m.status === "review" ? "alert-triangle" : "x", size: 16,
        className: "", title: m.status === "auto" ? "Automaticky" : m.status === "review" ? "Čeká na kontrolu" : "Nezpracovatelné" })
    },
    { key: "from", label: "Odesílatel", width: "20%", render: (m) =>
      e("div", null,
        e("div", { style: { font: "500 13px/18px var(--font-body)" } }, m.from),
        e("div", { className: "s21-cell-meta" }, "do ", m.inbox, "@poemauh.cz")
      )
    },
    { key: "subject", label: "Předmět", sortable: true, width: "34%", render: (m) =>
      e("div", null,
        e("div", { className: "s21-cell-title" }, m.subject),
        m.attachments.length > 0 && e("div", { style: { display: "flex", gap: 4, marginTop: 4, flexWrap: "wrap" } },
          m.attachments.map((a, i) => e("span", { key: i, className: "attach-pill" },
            e(S.Icon, { name: "file", size: 11 }),
            a.name, " ", e("span", { className: "attach-pill__type" }, a.type)
          ))
        )
      )
    },
    { key: "received", label: "Přijato", width: "12%" },
    { key: "avgConf", label: "Confidence", align: "right", numeric: true, width: "12%", render: (m) =>
      e(ConfPill, { v: m.avgConf })
    },
    { key: "state", label: "Stav", width: "14%", render: (m) => e(StatusBadge, { s: m.status }) },
    { key: "actions", label: "", align: "center", width: "4%", render: () =>
      e(S.Button, { size: "sm", iconOnly: true, icon: "chevron-right", variant: "ghost", "aria-label": "Otevřít" })
    }
  ];

  const CRUMBS = [{ label: "Automatizace / AI", href: "/dms/automatizace" }];

  function Page() {
    const [tab, setTab] = React.useState("fronta");
    const [filter, setFilter] = React.useState("review");
    const [inbox, setInbox] = React.useState("");
    const [q, setQ] = React.useState("");
    const [drawer, setDrawer] = React.useState(null);

    let rows = EMAILS;
    if (filter === "review") rows = rows.filter((m) => m.status === "review");
    else if (filter === "auto") rows = rows.filter((m) => m.status === "auto");
    else if (filter === "fail") rows = rows.filter((m) => m.status === "fail");
    if (inbox) rows = rows.filter((m) => m.inbox === inbox);
    if (q) rows = rows.filter((m) => (m.from + " " + m.subject).toLowerCase().includes(q.toLowerCase()));
    // Sort: status first (review > fail > auto), then confidence asc, then received desc
    rows = [...rows].sort((a, b) => {
      const prio = { review: 0, fail: 1, auto: 2 };
      if (prio[a.status] !== prio[b.status]) return prio[a.status] - prio[b.status];
      return a.avgConf - b.avgConf;
    });

    return e(S.AppShell, {
      sidebar: e(D.DemoSidebar, { active: "/dms/automatizace" }),
      topbar: e(D.DemoTopBar, { crumbs: CRUMBS }),
    },
      e(S.PageHeader, {
        title: "Automatizace",
        description: "AI zpracovává příchozí e-maily z doménových schránek a extrahuje údaje. Člověk schvaluje.",
        actions: e(React.Fragment, null,
          e(S.Button, { variant: "secondary", icon: "refresh" }, "Sync teď"),
          e(S.Button, { variant: "secondary", icon: "settings" }, "Nastavení")
        ),
        tabs: e(S.Tabs, { value: tab, onChange: setTab, items: [
          { value: "fronta", label: "Fronta", count: EMAILS.length },
          { value: "schranky", label: "Schránky" },
          { value: "historie", label: "Historie" },
        ] })
      }),
      e(S.PageBody, null,

        tab === "fronta" && e(React.Fragment, null,
          e(S.KpiRow, { cols: 4 },
            e(S.StatTile, { label: "Automaticky zpracováno", value: String(AUTO) }),
            e(S.StatTile, { label: "Čeká na kontrolu", value: String(PENDING), accent: PENDING > 0 ? "warning" : undefined }),
            e(S.StatTile, { label: "Úspěšnost AI", value: successRate + " %" }),
            e(S.StatTile, { label: "Ušetřený čas (měs.)", value: "~34", unit: "h", big: true })
          ),

          e(S.ChipGroup, { value: filter, onChange: setFilter, items: [
            { value: "all", label: "Vše", count: EMAILS.length },
            { value: "review", label: "Čeká na kontrolu", count: PENDING },
            { value: "auto", label: "Automaticky", count: AUTO },
            { value: "fail", label: "Nezpracovatelné", count: FAIL },
          ] }),

          e(S.FilterBar, null,
            e(S.SearchInput, { className: "s21-grow", value: q, onChange: setQ, placeholder: "Hledat odesílatele, předmět…" }),
            e(S.Select, { value: inbox, onChange: setInbox, placeholder: "Všechny schránky", options: [
              { value: "", label: "Všechny schránky" },
              { value: "pojisteni", label: "pojisteni@poemauh.cz" },
              { value: "energie", label: "energie@poemauh.cz" },
            ] })
          ),

          e(S.DataTable, {
            columns: COLUMNS, rows, minWidth: 1100,
            onRowClick: (m) => setDrawer(m)
          })
        ),

        tab === "schranky" && e(S.Section, { title: "Monitorované schránky" },
          e("div", { style: { display: "flex", flexDirection: "column", gap: "var(--space-3)" } },
            e("div", { className: "inbox-config" },
              e("div", { className: "inbox-config__ic" }, e(S.Icon, { name: "mail", size: 18 })),
              e("div", { style: { flex: 1 } },
                e("div", { style: { font: "600 15px/20px var(--font-body)" } }, "pojisteni@poemauh.cz"),
                e("div", { style: { font: "400 12px/16px var(--font-body)", color: "var(--ink-muted)" } }, "IMAP · 15min interval · Allianz, UNIQA, ČPP, Generali, Kooperativa")
              ),
              e(S.Badge, { tone: "success", fitCell: true }, "Aktivní"),
              e(S.Button, { size: "sm", variant: "secondary", icon: "settings" }, "Nastavit")
            ),
            e("div", { className: "inbox-config" },
              e("div", { className: "inbox-config__ic" }, e(S.Icon, { name: "mail", size: 18 })),
              e("div", { style: { flex: 1 } },
                e("div", { style: { font: "600 15px/20px var(--font-body)" } }, "energie@poemauh.cz"),
                e("div", { style: { font: "400 12px/16px var(--font-body)", color: "var(--ink-muted)" } }, "IMAP · 15min interval · ČEZ, innogy, E.ON")
              ),
              e(S.Badge, { tone: "success", fitCell: true }, "Aktivní"),
              e(S.Button, { size: "sm", variant: "secondary", icon: "settings" }, "Nastavit")
            ),
            e(S.Button, { variant: "secondary", icon: "plus" }, "Přidat schránku")
          )
        ),

        tab === "historie" && e(S.Section, { title: "Historie všech zpracovaných e-mailů" },
          e(S.EmptyState, { icon: "folder", title: "Historie 60+ dnů", description: "Všech 1 234 zpracovaných e-mailů za poslední 2 měsíce. Tabulka v produkci; v demu jen fronta výše.", action: e(S.Button, { variant: "secondary", onClick: () => setTab("fronta") }, "Zpět na frontu") })
        ),

        // ───── Drawer ─────────────────────────────────────────────
        e(S.Drawer, {
          open: !!drawer,
          onClose: () => setDrawer(null),
          side: "right",
          size: 520,
          title: drawer ? drawer.subject : "",
          description: drawer ? "Od " + drawer.from : "",
          footer: drawer && e(React.Fragment, null,
            drawer.status !== "fail" && e(S.Button, { icon: "check" }, "Schválit a napojit"),
            drawer.status === "review" && e(S.Button, { variant: "secondary", icon: "edit" }, "Opravit"),
            e(S.Button, { variant: "secondary", icon: "clock" }, "Odložit"),
            e(S.Button, { variant: "secondary", icon: "x" }, "Nezpracovatelné")
          )
        },
          drawer && e("div", { style: { display: "flex", flexDirection: "column", gap: "var(--space-4)" } },

            e("div", { className: "email-head" },
              e("div", { className: "email-head__from" }, drawer.from),
              e("div", { className: "email-head__subj" }, drawer.subject),
              e("div", { className: "email-head__meta" }, "Přijato: ", drawer.received, " · ", drawer.inbox, "@poemauh.cz")
            ),

            drawer.attachments.length > 0 && e("div", null,
              e("div", { style: { font: "500 11px/16px var(--font-mono)", letterSpacing: ".04em", textTransform: "uppercase", color: "var(--ink-muted)", marginBottom: "var(--space-2)" } }, "Přílohy (" + drawer.attachments.length + ")"),
              e("div", { style: { display: "flex", flexWrap: "wrap", gap: 6 } },
                drawer.attachments.map((a, i) => e("span", { key: i, className: "attach-pill" },
                  e(S.Icon, { name: "file", size: 11 }),
                  a.name,
                  " ",
                  e("span", { className: "attach-pill__type" }, a.type)
                ))
              )
            ),

            e("div", null,
              e("div", { style: { display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: "var(--space-2)" } },
                e("div", { style: { font: "500 11px/16px var(--font-mono)", letterSpacing: ".04em", textTransform: "uppercase", color: "var(--ink-muted)" } }, "Extrahované údaje"),
                e(ConfPill, { v: drawer.avgConf })
              ),
              e("div", { style: { background: "var(--surface-raised)", border: "1px solid var(--border)", borderRadius: "var(--radius-lg)", overflow: "hidden" } },
                Object.entries(drawer.extracted).map(([k, { value, conf }]) =>
                  e("div", { key: k, className: "field-row" },
                    e("div", { className: "field-row__label" }, k),
                    e("div", { className: "field-row__value" }, value),
                    e(ConfPill, { v: conf })
                  )
                )
              )
            ),

            drawer.status === "review" && e(S.Callout, { tone: "warning", title: "Vyžaduje ruční kontrolu" },
              "Některá pole mají confidence pod 85 %. Zkontroluj údaje, uprav pokud třeba a potvrď napojení na klienta/smlouvu."
            ),

            drawer.status === "fail" && e(S.Callout, { tone: "danger", title: "Nezpracovatelný e-mail" },
              "AI nedokázala rozpoznat typ dokumentu (confidence pod 20 %). Nejspíš newsletter nebo phishing."
            )
          )
        )
      )
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(e(Page));
})();
</script>
</body>
</html>
