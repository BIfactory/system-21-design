<!doctype html>
<html lang="cs" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>System 21 · Přihlášení</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../tokens/tokens.css">
<link rel="stylesheet" href="../dist/system21.css">
<script>(function(){try{var b=localStorage.getItem('system21-brand');if(b&&b!=='bifactory')document.documentElement.setAttribute('data-brand',b);var t=localStorage.getItem('system21-theme');if(t==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
<script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="../dist/system21.js"></script>
<style>
  body { background: var(--canvas); min-height: 100vh; margin: 0; }
  .login-page { min-height: 100vh; display: grid; grid-template-columns: 1fr 1fr; }
  .login-brandside { position: relative; background: linear-gradient(135deg, var(--primary) 0%, color-mix(in srgb, var(--primary) 70%, var(--black)) 100%); color: var(--on-primary); padding: var(--space-8); display: flex; flex-direction: column; justify-content: space-between; }
  .login-brandside::before { content: ""; position: absolute; inset: 0; background-image: radial-gradient(circle at 80% 20%, rgba(255,255,255,0.08) 0%, transparent 50%), radial-gradient(circle at 20% 80%, rgba(255,255,255,0.05) 0%, transparent 50%); pointer-events: none; }
  .login-brand { position: relative; display: flex; align-items: center; gap: var(--space-3); font: 800 20px/1 var(--font-display); }
  .login-brandmark { width: 40px; height: 40px; border-radius: var(--radius-lg); background: var(--on-primary); color: var(--primary); display: inline-flex; align-items: center; justify-content: center; font: 800 18px var(--font-display); }
  .login-hero { position: relative; max-width: 480px; }
  .login-hero h1 { margin: 0 0 var(--space-3) 0; font: 800 36px/1.1 var(--font-display); letter-spacing: -0.03em; }
  .login-hero p { margin: 0; font: 400 16px/24px var(--font-body); opacity: .9; max-width: 440px; }
  .login-foot { position: relative; font: 400 12px/16px var(--font-body); opacity: .7; }
  .login-formside { background: var(--canvas); padding: var(--space-8); display: flex; align-items: center; justify-content: center; }
  .login-form { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: var(--space-5); }
  .login-controls { position: absolute; top: var(--space-4); right: var(--space-4); display: inline-flex; gap: var(--space-2); z-index: 10; }
  @media (max-width: 767px) {
    .login-page { grid-template-columns: 1fr; }
    .login-brandside { padding: var(--space-5); min-height: 240px; }
    .login-hero h1 { font-size: 28px; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script>
(() => {
  const S = window.S21, e = React.createElement;

  function Page() {
    const [email, setEmail] = React.useState("hulin@bifactory.cz");
    const [pass, setPass] = React.useState("");
    const [remember, setRemember] = React.useState(true);
    const [loading, setLoading] = React.useState(false);

    const submit = (ev) => {
      ev.preventDefault();
      setLoading(true);
      setTimeout(() => {
        window.location.href = "./dashboard.html";
      }, 600);
    };

    return e("div", { className: "login-page" },
      e("div", { className: "login-controls" },
        e(S.BrandToggle),
        e(S.ThemeToggle)
      ),
      e("aside", { className: "login-brandside" },
        e("div", { className: "login-brand" },
          e("span", { className: "login-brandmark" }, "BI"),
          e("span", null, "BIfactory"),
          e("span", { style: { opacity: .6, fontWeight: 400, font: "500 11px/16px var(--font-mono)", letterSpacing: ".08em", textTransform: "uppercase", marginLeft: "var(--space-2)" } }, "System 21")
        ),
        e("div", { className: "login-hero" },
          e("h1", null, "Vítejte zpátky."),
          e("p", null, "Platforma pro řízení klientů, smluv a procesů. Napojená na vaše stávající nástroje — e-mail, dokumenty, SMS, pojistitele. AI asistentka vám pomáhá s denní rutinou.")
        ),
        e("div", { className: "login-foot" },
          "© 2026 BIfactory · ",
          e("a", { href: "#", style: { color: "inherit" } }, "Dokumentace"),
          " · ",
          e("a", { href: "#", style: { color: "inherit" } }, "Podpora")
        )
      ),
      e("main", { className: "login-formside" },
        e("form", { className: "login-form", onSubmit: submit },
          e("div", null,
            e("h2", { style: { margin: "0 0 4px 0", font: "800 24px/1.2 var(--font-display)" } }, "Přihlášení"),
            e("p", { style: { margin: 0, font: "400 14px/20px var(--font-body)", color: "var(--ink-muted)" } }, "Použijte firemní e-mail. Pokud jste zapomněli heslo, dole je odkaz na obnovu.")
          ),
          e(S.Field, { label: "E-mail" },
            e(S.Input, { value: email, onChange: setEmail, type: "email", placeholder: "jmeno@firma.cz", autoFocus: true })
          ),
          e(S.Field, {
            label: "Heslo",
            action: e("a", { href: "#", style: { font: "500 12px/16px var(--font-body)", color: "var(--primary-text)", textDecoration: "none" } }, "Zapomněli jste?")
          },
            e(S.Input, { value: pass, onChange: setPass, type: "password", placeholder: "••••••••" })
          ),
          e("div", { style: { display: "flex", alignItems: "center", gap: "var(--space-2)" } },
            e(S.Checkbox, { checked: remember, onChange: setRemember, label: "Zůstat přihlášený na tomto zařízení" })
          ),
          e(S.Button, { type: "submit", loading, disabled: !email || !pass, icon: "arrow-right" }, loading ? "Přihlašuji…" : "Přihlásit se"),
          e("div", { style: { display: "flex", alignItems: "center", gap: "var(--space-3)", margin: "var(--space-2) 0" } },
            e("hr", { style: { flex: 1, border: 0, borderTop: "1px solid var(--border)" } }),
            e("span", { style: { font: "500 11px/14px var(--font-mono)", letterSpacing: ".08em", textTransform: "uppercase", color: "var(--ink-muted)" } }, "nebo"),
            e("hr", { style: { flex: 1, border: 0, borderTop: "1px solid var(--border)" } })
          ),
          e(S.Button, { type: "button", variant: "secondary", icon: "mail", onClick: () => { setLoading(true); setTimeout(() => window.location.href = "./dashboard.html", 400); } }, "Pokračovat přes Google"),
          e(S.Button, { type: "button", variant: "secondary", icon: "building", onClick: () => { setLoading(true); setTimeout(() => window.location.href = "./dashboard.html", 400); } }, "Pokračovat přes Microsoft 365"),
          e("div", { style: { marginTop: "var(--space-4)", font: "400 12px/16px var(--font-body)", color: "var(--ink-muted)", textAlign: "center" } },
            "Nemáte účet? ",
            e("a", { href: "#", style: { color: "var(--primary-text)" } }, "Kontaktujte administrátora")
          )
        )
      )
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(e(Page));
})();
</script>
</body>
</html>
