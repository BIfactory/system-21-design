<!doctype html>
<html lang="cs" data-theme="light">
<head>
<meta charset="utf-8">

<script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>

<style>
  .greeting { font: 800 28px/1.2 var(--font-display); color: var(--ink); letter-spacing: -.02em; }
  .greeting__sub { font: 400 15px/22px var(--font-body); color: var(--ink-muted); margin-top: 4px; }

  /* Global search */
  .gsearch { position: relative; max-width: 640px; }
  .gsearch__input { width: 100%; padding: var(--space-3) var(--space-3) var(--space-3) 44px; background: var(--surface-raised); border: 1px solid var(--border); border-radius: var(--radius-xl); font: 500 15px/22px var(--font-body); color: var(--ink); box-shadow: var(--elev-1); }
  .gsearch__input:focus { outline: 2px solid var(--focus-ring); outline-offset: 2px; border-color: var(--primary); }
  .gsearch__icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--ink-muted); pointer-events: none; }
  .gsearch__results { position: absolute; top: calc(100% + 4px); left: 0; right: 0; background: var(--surface-raised); border: 1px solid var(--border); border-radius: var(--radius-xl); box-shadow: var(--elev-4); max-height: 420px; overflow-y: auto; z-index: 10; }
  .gsearch__group { padding: var(--space-1); }
  .gsearch__group + .gsearch__group { border-top: 1px solid var(--border-subtle); }
  .gsearch__grouplabel { padding: var(--space-2) var(--space-2) var(--space-1); font: 500 10px/14px var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-muted); }
  .gsearch__item { display: flex; align-items: center; gap: var(--space-2); padding: var(--space-2) var(--space-2); border-radius: var(--radius-md); cursor: pointer; color: var(--ink); text-decoration: none; }
  .gsearch__item:hover { background: var(--surface-muted); }
  .gsearch__itemmain { flex: 1; min-width: 0; }
  .gsearch__itemtitle { font: 500 14px/20px var(--font-body); }
  .gsearch__itemmeta { font: 400 12px/16px var(--font-body); color: var(--ink-muted); }

  /* Main 2-col block */
  .s21-grid-main-aside { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4); }
  @media (max-width: 900px) { .s21-grid-main-aside { grid-template-columns: 1fr; } }

  /* Decide panel */
  .decide-panel { background: var(--surface-raised); border: 1px solid var(--border); border-radius: var(--radius-xl); overflow: hidden; }
  .decide-panel__head { display: flex; align-items: center; justify-content: space-between; padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--border-subtle); }
  .decide-panel__title { font: 600 14px/20px var(--font-body); color: var(--ink); display: flex; align-items: center; gap: var(--space-2); }
  .decide-row { display: flex; align-items: flex-start; gap: var(--space-3); padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--border-subtle); text-decoration: none; color: var(--ink); transition: background 100ms; }
  .decide-row:last-child { border-bottom: 0; }
  .decide-row:hover { background: var(--surface-muted); }
  .decide-row__ic { width: 32px; height: 32px; border-radius: var(--radius-full); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .decide-row__ic--warning { background: var(--warning-bg); color: var(--warning-text); }
  .decide-row__ic--primary { background: var(--primary-soft); color: var(--primary-text); }
  .decide-row__ic--default { background: var(--surface-muted); color: var(--ink-muted); }
  .decide-row__main { flex: 1; min-width: 0; }
  .decide-row__section { font: 500 10px/14px var(--font-mono); letter-spacing: .07em; text-transform: uppercase; color: var(--ink-muted); margin-bottom: 2px; }
  .decide-row__title { font: 500 14px/20px var(--font-body); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .decide-row__meta { font: 400 12px/16px var(--font-body); color: var(--ink-muted); }

  /* Activity / timeline */
  .activity-panel { background: var(--surface-raised); border: 1px solid var(--border); border-radius: var(--radius-xl); overflow: hidden; }
  .activity-panel__head { display: flex; align-items: center; justify-content: space-between; padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--border-subtle); }
  .activity-panel__title { font: 600 14px/20px var(--font-body); color: var(--ink); display: flex; align-items: center; gap: var(--space-2); }
  .tl { padding: var(--space-2) var(--space-4); }
  .tl-item { display: flex; align-items: flex-start; gap: var(--space-3); padding: var(--space-2) 0; position: relative; }
  .tl-item + .tl-item::before { content: ""; position: absolute; left: 15px; top: -8px; width: 2px; height: 8px; background: var(--border-subtle); }
  .tl-ic { width: 32px; height: 32px; border-radius: var(--radius-full); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .tl-ic--success { background: var(--success-bg, #d1fae5); color: var(--success-text, #065f46); }
  .tl-ic--primary { background: var(--primary-soft); color: var(--primary-text); }
  .tl-ic--default { background: var(--surface-muted); color: var(--ink-muted); }
  .tl-main { flex: 1; min-width: 0; }
  .tl-text { font: 400 13px/18px var(--font-body); color: var(--ink); }
  .tl-client { font: 400 12px/16px var(--font-body); color: var(--ink-muted); }
  .tl-time { font: 400 11px/16px var(--font-mono); color: var(--ink-subtle); flex-shrink: 0; }

  /* Lifecycle banner */
  .lifecycle-banner { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-4); background: linear-gradient(135deg, var(--primary-soft) 0%, var(--surface-raised) 60%); border-radius: var(--radius-xl); border: 1px solid var(--border); }
  .lc-step { flex: 1; display: flex; flex-direction: column; gap: 4px; padding: var(--space-3); background: var(--surface-raised); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); text-decoration: none; color: var(--ink); transition: background 150ms; }
  .lc-step:hover { background: var(--surface-muted); }
  .lc-step h3 { margin: 0; font: 500 11px/16px var(--font-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-muted); }
  .lc-num { font: 700 28px/32px var(--font-display); color: var(--primary-text); }
  .lc-sub { font: 400 12px/16px var(--font-body); color: var(--ink-muted); }
  .lc-arrow { color: var(--ink-subtle); flex-shrink: 0; }
  .lc-arrow-char { font: 700 24px/32px sans-serif; color: var(--ink-subtle); flex-shrink: 0; }
  @media (max-width: 767px) {
    .lifecycle-banner { flex-direction: column; }
    .lc-arrow { transform: rotate(90deg); }
    .lc-arrow-char { transform: rotate(90deg); }
    .lc-step { width: 100%; }
  }

  /* Hero progress bar */
  .ceo-hero { padding: var(--space-4); background: linear-gradient(135deg, var(--primary-soft) 0%, var(--surface-raised) 60%); border: 1px solid var(--border); border-radius: var(--radius-xl); display: flex; flex-direction: column; gap: var(--space-2); margin-bottom: var(--space-4); }
  .ceo-hero__label { font: 500 11px/16px var(--font-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-muted); }
  .ceo-hero__bar-wrap { padding: 8px 0; }
  .ceo-hero__bar { position: relative; height: 12px; background: var(--surface-muted); border-radius: var(--radius-full); overflow: hidden; }
  .ceo-hero__bar-fill { position: absolute; left: 0; top: 0; height: 100%; background: var(--success-solid); }
  .ceo-hero__bar-projected { position: absolute; top: 0; height: 100%; background: var(--success-solid); opacity: 0.35; }
  .ceo-hero__numbers { display: flex; gap: var(--space-4); font: 400 13px/18px var(--font-body); color: var(--ink-muted); flex-wrap: wrap; }
  .ceo-hero__numbers strong { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }

  /* Mini capacity widget */
  .cap-mini { display: flex; flex-direction: column; gap: 6px; }
  .cap-mini__row { display: grid; grid-template-columns: 160px 1fr 50px; align-items: center; gap: var(--space-3); font: 400 13px/18px var(--font-body); }
  .cap-mini__name { color: var(--ink); }
  .cap-mini__bar { height: 8px; background: var(--surface-muted); border-radius: var(--radius-full); overflow: hidden; }
  .cap-mini__fill { height: 100%; }
  .cap-mini__fill--empty { background: var(--surface-muted); }
  .cap-mini__fill--low { background: var(--warning-solid); }
  .cap-mini__fill--ok { background: var(--success-solid); }
  .cap-mini__fill--over { background: var(--danger-solid); }
  .cap-mini__pct { font-variant-numeric: tabular-nums; color: var(--ink-muted); text-align: right; }

  /* Risk mini */
  .risk-mini { padding: var(--space-2) var(--space-3); border-bottom: 1px solid var(--border-subtle); }
  .risk-mini:last-child { border-bottom: 0; }

  /* Deník dne */
  .diary-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--space-4); }
  @media (max-width: 1100px) { .diary-grid { grid-template-columns: 1fr; } }
  .diary-section { background: var(--surface-raised); border: 1px solid var(--border); border-radius: var(--radius-xl); overflow: hidden; }
  .diary-section__head { display: flex; align-items: center; justify-content: space-between; padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--border-subtle); }
  .diary-section__title { font: 600 14px/20px var(--font-body); color: var(--ink); display: flex; align-items: center; gap: var(--space-2); }
  .diary-section__count { padding: 2px 8px; background: var(--primary-soft); color: var(--primary-text); border-radius: var(--radius-full); font: 700 11px/16px var(--font-mono); }
  .diary-section__count--warn { background: var(--warning-bg); color: var(--warning-text); }
  .diary-section__count--danger { background: var(--danger-bg); color: var(--danger-text); }
  .diary-section__link { font: 500 12px/16px var(--font-body); color: var(--primary-text); text-decoration: none; }
  .diary-section__link:hover { text-decoration: underline; }
  .diary-row { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-2) var(--space-4); border-bottom: 1px solid var(--border-subtle); text-decoration: none; color: var(--ink); }
  .diary-row:last-child { border-bottom: 0; }
  .diary-row:hover { background: var(--surface-muted); }
  .diary-row__ic { width: 28px; height: 28px; border-radius: var(--radius-full); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; background: var(--surface-muted); color: var(--ink-muted); }
  .diary-row__ic--primary { background: var(--primary-soft); color: var(--primary-text); }
  .diary-row__ic--warning { background: var(--warning-bg); color: var(--warning-text); }
  .diary-row__ic--danger { background: var(--danger-bg); color: var(--danger-text); }
  .diary-row__main { flex: 1; min-width: 0; }
  .diary-row__title { font: 500 14px/20px var(--font-body); }
  .diary-row__meta { font: 400 12px/16px var(--font-body); color: var(--ink-muted); }
</style>
</head>
<body>
<div id="root"></div>
<script>
(() => {
  const S = window.S21, D = window.S21Demo, e = React.createElement;
  const SD = window.S21Data;

  // ── Cross-cut KPI data from S21Data ───────────────────────────────────────
  const WP = SD.WEEKLY_PLAN;
  const openCases = SD.getOpenCases();
  const active = SD.getActiveOrders();
  const pipelineValue = openCases.reduce((s, c) => s + (c.value || 0), 0);
  const rozpracovanostKc = active.reduce((s, o) => s + (o.realHours * 1500), 0);
  const fmt = (n) => n.toLocaleString("cs-CZ").replace(/,/g, " ");

  // ── Greeting by hour ──────────────────────────────────────────────────────
  const hour = new Date().getHours();
  const greet = hour < 10 ? "Dobré ráno" : hour < 17 ? "Dobrý den" : "Dobrý večer";

  // ── Global search mock index ──────────────────────────────────────────────
  const SEARCH_INDEX = [
    { type: "client", title: "Novákovi", meta: "Rodina · Zlín · 4 členové · 3 smlouvy", href: "./crm-klient-detail.html" },
    { type: "client", title: "Dvořákovi", meta: "Rodina · Uherské Hradiště · 2 členové · 2 smlouvy", href: "./crm-klient-detail.html" },
    { type: "client", title: "Moravia Steel a.s.", meta: "Firma · IČ 25812345 · 8 smluv", href: "./crm-klient-detail.html" },
    { type: "client", title: "Agro Slovácko s.r.o.", meta: "Firma · IČ 28192740 · 4 smlouvy", href: "./crm-klient-detail.html" },
    { type: "contract", title: "SM-2024-0117 Pojištění majetku", meta: "Allianz · Jan Novák · výročí 12. 04.", href: "./dms-smlouva-detail.html" },
    { type: "contract", title: "SM-2025-0233 Úrazové pojištění", meta: "UNIQA · Jan Novák · výročí 03. 03.", href: "./dms-smlouva-detail.html" },
    { type: "contract", title: "EL-2024-0045 Elektřina domácnost", meta: "ČEZ · Novákovi · konec fixace 30. 04. 2027", href: "./dms-smlouva-energie-detail.html" },
    { type: "order", title: "ZAK-2026-0131 Napojení ERP → CRM", meta: "Agro Slovácko · v realizaci · 92 %", href: "./zakazka-detail.html" },
    { type: "order", title: "ZAK-2026-0142 Reporting obchodu", meta: "Moravia Steel · nabídka · 184 000 Kč", href: "./zakazka-detail.html" },
    { type: "case", title: "OP-2026-0045 Rozšíření úrazovky", meta: "Novákovi · v jednání (naše strana)", href: "./crm-pripady.html" },
  ];

  const TYPE_LABEL = { client: "Klienti", contract: "Smlouvy", order: "Zakázky", case: "Případy" };
  const TYPE_ICON = { client: "users", contract: "file", order: "folder", case: "folder" };

  // ── Dnes rozhoduješ — mock curated feed ──────────────────────────────────
  const TODAY_DECIDE = [
    { icon: "info", tone: "warning", section: "VÝROBA", title: "ZAK-2026-0131 Napojení ERP → CRM — po termínu", meta: "Agro Slovácko · marže -4 %", href: "./zakazka-detail.html" },
    { icon: "users", tone: "primary", section: "OBCHOD", title: "OP-2026-0043 Moravia Steel — AI reporting", meta: "180 000 Kč pipeline · čeká na odpověď", href: "./crm-pripady.html" },
    { icon: "file", tone: "default", section: "DMS", title: "PL-2024-0067 Plyn — vyprší za 10 dnů", meta: "Hradecká strojírna · konec fixace 15. 11.", href: "./dms-smlouvy.html" },
    { icon: "tasks", tone: "default", section: "DMS", title: "3 emaily čekají na schválení (AI asistentka)", meta: "Nejnižší confidence 68 %", href: "./dms-automatizace.html" },
    { icon: "clock", tone: "primary", section: "ÚKOLY", title: "Zavolat Janu Novákovi o rozšíření úrazovky", meta: "deadline dnes", href: "./ukoly.html" },
  ];

  // ── Aktivita napříč firmou — timeline ─────────────────────────────────────
  const ACTIVITY = [
    { time: "10:42", icon: "check", tone: "success", text: "Smlouva SM-2026-089 podepsána", client: "Moravia Steel" },
    { time: "09:15", icon: "folder", tone: "primary", text: "Materiál M-01 vykázán na ZAK-2026-0131", client: "Alena D." },
    { time: "08:30", icon: "mail", tone: "default", text: "Nová poptávka od ing. Kříže", client: "Agro Slovácko" },
    { time: "včera 16:24", icon: "upload", tone: "default", text: "Nahrán cenník Allianz 2027", client: "AI asistentka" },
    { time: "včera 15:30", icon: "user", tone: "primary", text: "Nový pracovník Jana Svobodová nastoupí 17. 11.", client: null },
    { time: "včera 14:10", icon: "tasks", tone: "success", text: "3 úkoly dokončené", client: "Dvořákovi · Novákovi · Agro" },
  ];

  // ── Deník dne data ────────────────────────────────────────────────────────
  const DIARY = {
    aja: [
      { title: "Allianz — potvrzení smlouvy ALZ-2026-12847", meta: "confidence 94 % · auto zpracováno, čeká potvrzení", icon: "sparkles", tone: "primary" },
      { title: "ČPP — faktura autopojištění", meta: "confidence 71 % · vyžaduje ruční kontrolu", icon: "alert-triangle", tone: "warning" },
      { title: "ČEZ — změna ceníku 2027", meta: "confidence 68 % · dotčené smlouvy TBD", icon: "alert-triangle", tone: "warning" },
    ],
    orders: [
      { title: "ZAK-2026-0131 Napojení ERP → CRM", meta: "Agro Slovácko · plnění vzrostlo 80 % → 92 % · ⚠ po termínu", icon: "folder", tone: "danger" },
      { title: "ZAK-2026-0142 Reporting obchodu", meta: "Moravia Steel · nabídka odeslána → čeká na vyjádření", icon: "folder", tone: "primary" },
      { title: "ZAK-2026-0127 AI asistent pro zápisy", meta: "Obec Staré Město · dokončeno, k fakturaci", icon: "check", tone: "primary" },
    ],
    tasks: [
      { title: "Zavolat Janu Novákovi o rozšíření úrazovky", meta: "deadline dnes · OP-2026-0045", icon: "phone", tone: "primary" },
      { title: "Odeslat podklady pro Moravia Steel", meta: "deadline dnes · ZAK-2026-0142", icon: "send", tone: "primary" },
      { title: "Příprava schůzky s Dvořákovi", meta: "deadline dnes · 14:00 kancelář", icon: "calendar", tone: "primary" },
    ],
    expiring: [
      { title: "SM-2025-0198 Pojištění budovy", meta: "Hradecká strojírna · výročí 15. 01. 2027 · za 73 dnů", icon: "file", tone: "warning" },
      { title: "PL-2024-0067 Plyn — výroba", meta: "Hradecká strojírna · konec fixace 15. 11. 2026 · za 11 dnů", icon: "file", tone: "danger" },
      { title: "SM-2026-0117 Pojištění majetku", meta: "Novákovi · výročí 12. 04. 2027 · za 158 dnů", icon: "file", tone: "primary" },
    ],
  };

  const CRUMBS = [{ label: "Domů", href: "/" }];

  // ── CEOHome — full dashboard (T6: hero + 4 KPI + mini capacity + top 3 risks) ──
  function CEOHome() {
    const [search, setSearch] = React.useState("");
    const [focused, setFocused] = React.useState(false);
    const q = search.trim().toLowerCase();
    const results = q.length >= 2 ? SEARCH_INDEX.filter((r) =>
      (r.title + " " + r.meta).toLowerCase().includes(q)
    ) : [];
    const grouped = { client: [], contract: [], order: [], case: [] };
    results.forEach((r) => grouped[r.type].push(r));

    return e("div", null,

      // ── 1. Hero progress bar ──────────────────────────────────────────
      e("div", { className: "ceo-hero" },
        e("div", { className: "ceo-hero__label" }, "Týdenní plán tržeb · " + WP.weekLabel),
        e("div", { className: "ceo-hero__bar-wrap" },
          e("div", { className: "ceo-hero__bar" },
            e("div", { className: "ceo-hero__bar-fill", style: { width: (WP.closedThisWeek / WP.target * 100) + "%" } }),
            e("div", { className: "ceo-hero__bar-projected", style: { left: (WP.closedThisWeek / WP.target * 100) + "%", width: ((WP.projectedClose - WP.closedThisWeek) / WP.target * 100) + "%" } })
          )
        ),
        e("div", { className: "ceo-hero__numbers" },
          e("span", null, e("strong", null, fmt(WP.closedThisWeek) + " Kč"), " uzavřeno"),
          e("span", null, "projekce ", e("strong", null, fmt(WP.projectedClose) + " Kč")),
          e("span", null, "cíl ", e("strong", null, fmt(WP.target) + " Kč"), " (" + Math.round(WP.closedThisWeek / WP.target * 100) + " %)")
        )
      ),

      // ── 2. Greeting ───────────────────────────────────────────────────
      e("div", null,
        e("h1", { className: "greeting" }, greet + ", Lubomíre"),
        e("p", { className: "greeting__sub" }, "Dnes je pátek 7. listopadu 2026 · tento měsíc máš " + fmt(487500) + " Kč v zakázkách")
      ),

      // ── 3. KPI pruh — 4 sales-focused tiles ──────────────────────────
      e(S.KpiRow, { cols: 4 },
        e(S.StatTile, {
          label: "Uzavřeno (týden)",
          value: fmt(WP.closedThisWeek),
          unit: "Kč",
          big: true,
          accent: "success",
        }),
        e(S.StatTile, {
          label: "Rozplánováno",
          value: fmt(WP.plannedThisWeek),
          unit: "Kč",
          hint: "do konce týdne",
        }),
        e(S.StatTile, {
          label: "Projekce konec týdne",
          value: fmt(WP.projectedClose),
          unit: "Kč",
          hint: Math.round(WP.projectedClose / WP.target * 100) + " % cíle",
        }),
        e(S.StatTile, {
          label: "Pipeline hodnota",
          value: fmt(pipelineValue),
          unit: "Kč",
          hint: openCases.length + " otevřených",
        })
      ),

      // ── 4. Mini capacity widget ───────────────────────────────────────
      e(S.Section, { title: "Utilizace kapacit (tento týden)" },
        e("div", { className: "cap-mini" },
          SD.WORKERS.slice(0, 7).map(w => {
            const weekUtil = Math.round(SD.WORKING_DAYS.reduce((s, d) => s + SD.getUtilization(w.id, d), 0) / SD.WORKING_DAYS.length);
            const tone = weekUtil === 0 ? "empty" : weekUtil < 60 ? "low" : weekUtil <= 110 ? "ok" : "over";
            return e("div", { key: w.id, className: "cap-mini__row" },
              e("div", { className: "cap-mini__name" }, w.name),
              e("div", { className: "cap-mini__bar" }, e("div", { className: "cap-mini__fill cap-mini__fill--" + tone, style: { width: Math.min(100, weekUtil) + "%" } })),
              e("div", { className: "cap-mini__pct" }, weekUtil + " %")
            );
          })
        )
      ),

      // ── 5. Hlavní 2-col blok ──────────────────────────────────────────
      e("div", { className: "s21-grid-main-aside" },

        // Levý panel — Dnes rozhoduješ
        e("div", { className: "decide-panel" },
          e("div", { className: "decide-panel__head" },
            e("div", { className: "decide-panel__title" },
              e(S.Icon, { name: "flag", size: 16 }),
              "Dnes rozhoduješ"
            )
          ),
          TODAY_DECIDE.map((item, i) =>
            e("a", { key: i, href: item.href, className: "decide-row" },
              e("span", { className: "decide-row__ic decide-row__ic--" + item.tone },
                e(S.Icon, { name: item.icon, size: 15 })
              ),
              e("div", { className: "decide-row__main" },
                e("div", { className: "decide-row__section" }, item.section),
                e("div", { className: "decide-row__title" }, item.title),
                e("div", { className: "decide-row__meta" }, item.meta)
              )
            )
          )
        ),

        // Pravý panel — Aktivita napříč firmou
        e("div", { className: "activity-panel" },
          e("div", { className: "activity-panel__head" },
            e("div", { className: "activity-panel__title" },
              e(S.Icon, { name: "activity", size: 16 }),
              "Aktivita napříč firmou"
            )
          ),
          e("div", { className: "tl" },
            ACTIVITY.map((item, i) =>
              e("div", { key: i, className: "tl-item" },
                e("span", { className: "tl-ic tl-ic--" + item.tone },
                  e(S.Icon, { name: item.icon, size: 14 })
                ),
                e("div", { className: "tl-main" },
                  e("div", { className: "tl-text" }, item.text),
                  item.client && e("div", { className: "tl-client" }, item.client)
                ),
                e("div", { className: "tl-time" }, item.time)
              )
            )
          )
        )
      ),

      // ── 6. Top 3 zakázky v riziku ─────────────────────────────────────
      e(S.Section, { title: "Top 3 zakázky v riziku" },
        SD.getActiveOrders()
          .map(o => ({ o, score: SD.getRiskScore(o) }))
          .filter(x => x.score > 0)
          .sort((a, b) => b.score - a.score)
          .slice(0, 3)
          .map(x => e("div", { key: x.o.id, className: "risk-mini" },
            e("div", null, e("strong", null, x.o.code), " · ", x.o.name),
            e("div", { className: "s21-cell-meta" }, x.o.client)
          ))
      ),

      // ── 7. Lifecycle banner ───────────────────────────────────────────
      e("div", { className: "lifecycle-banner" },
        e("a", { className: "lc-step", href: "./crm-pripady.html" },
          e("h3", null, "V jednání"),
          e("div", { className: "lc-num" }, String(openCases.length)),
          e("div", { className: "lc-sub" }, fmt(pipelineValue) + " Kč pipeline")
        ),
        e("span", { className: "lc-arrow-char" }, "→"),
        e("a", { className: "lc-step", href: "./zakazky.html" },
          e("h3", null, "V realizaci"),
          e("div", { className: "lc-num" }, String(active.length)),
          e("div", { className: "lc-sub" }, fmt(rozpracovanostKc) + " Kč rozpracováno")
        ),
        e("span", { className: "lc-arrow-char" }, "→"),
        e("a", { className: "lc-step", href: "./zakazky.html" },
          e("h3", null, "Dokončeno YTD"),
          e("div", { className: "lc-num" }, String(SD.ORDERS.filter(o => o.status === "done" || o.status === "delivered").length)),
          e("div", { className: "lc-sub" }, fmt(SD.ORDERS.filter(o => o.status === "done" || o.status === "delivered").reduce((s, o) => s + (o.priceOffer || 0), 0)) + " Kč fakturováno")
        )
      ),

      // ── 8. Global search widget ───────────────────────────────────────
      e("div", { className: "gsearch" },
        e(S.Icon, { name: "search", size: 18, className: "gsearch__icon" }),
        e("input", {
          type: "search",
          className: "gsearch__input",
          placeholder: "Najdi klienta, smlouvu, zakázku… (i zkratkou pro rodinu)",
          value: search,
          onChange: (ev) => setSearch(ev.target.value),
          onFocus: () => setFocused(true),
          onBlur: () => setTimeout(() => setFocused(false), 200),
        }),
        focused && results.length > 0 && e("div", { className: "gsearch__results" },
          ["client", "contract", "order", "case"].map((t) => grouped[t].length > 0 && e("div", { key: t, className: "gsearch__group" },
            e("div", { className: "gsearch__grouplabel" }, TYPE_LABEL[t] + " (" + grouped[t].length + ")"),
            grouped[t].slice(0, 5).map((r, i) => e("a", { key: i, href: r.href, className: "gsearch__item" },
              e(S.Icon, { name: TYPE_ICON[t], size: 14 }),
              e("div", { className: "gsearch__itemmain" },
                e("div", { className: "gsearch__itemtitle" }, r.title),
                e("div", { className: "gsearch__itemmeta" }, r.meta)
              )
            ))
          ))
        ),
        focused && q.length >= 2 && results.length === 0 && e("div", { className: "gsearch__results" },
          e("div", { style: { padding: "var(--space-4)", textAlign: "center", color: "var(--ink-muted)", font: "400 13px/18px var(--font-body)" } }, "Nic nenalezeno pro „" + search + "“")
        )
      ),

      // ── 9. Deník dne — 4 bloky ────────────────────────────────────────
      e("div", null,
        e("h2", { style: { font: "700 20px/28px var(--font-display)", color: "var(--ink)", margin: "0 0 var(--space-3) 0" } }, "Deník dne"),
        e("div", { className: "diary-grid" },

          // AI asistentka — čeká na kontrolu
          e("div", { className: "diary-section" },
            e("div", { className: "diary-section__head" },
              e("div", { className: "diary-section__title" },
                e(S.Icon, { name: "sparkles", size: 16 }),
                "AI asistentka — čeká na kontrolu",
                e("span", { className: "diary-section__count diary-section__count--warn" }, DIARY.aja.length)
              ),
              e("a", { href: "./dms-automatizace.html", className: "diary-section__link" }, "Celá fronta →")
            ),
            DIARY.aja.map((it, i) => e("a", { key: i, href: "./dms-automatizace.html", className: "diary-row" },
              e("span", { className: "diary-row__ic diary-row__ic--" + (it.tone || "") }, e(S.Icon, { name: it.icon, size: 14 })),
              e("div", { className: "diary-row__main" },
                e("div", { className: "diary-row__title" }, it.title),
                e("div", { className: "diary-row__meta" }, it.meta)
              )
            ))
          ),

          // Zakázky
          e("div", { className: "diary-section" },
            e("div", { className: "diary-section__head" },
              e("div", { className: "diary-section__title" },
                e(S.Icon, { name: "folder", size: 16 }),
                "Zakázky, které se pohnuly",
                e("span", { className: "diary-section__count" }, DIARY.orders.length)
              ),
              e("a", { href: "./zakazky.html", className: "diary-section__link" }, "Všechny zakázky →")
            ),
            DIARY.orders.map((it, i) => e("a", { key: i, href: "./zakazka-detail.html", className: "diary-row" },
              e("span", { className: "diary-row__ic diary-row__ic--" + (it.tone || "") }, e(S.Icon, { name: it.icon, size: 14 })),
              e("div", { className: "diary-row__main" },
                e("div", { className: "diary-row__title" }, it.title),
                e("div", { className: "diary-row__meta" }, it.meta)
              )
            ))
          ),

          // Úkoly
          e("div", { className: "diary-section" },
            e("div", { className: "diary-section__head" },
              e("div", { className: "diary-section__title" },
                e(S.Icon, { name: "tasks", size: 16 }),
                "Úkoly s deadline dnes",
                e("span", { className: "diary-section__count" }, DIARY.tasks.length)
              ),
              e("a", { href: "./_coming.html#/ukoly", className: "diary-section__link" }, "Všechny úkoly →")
            ),
            DIARY.tasks.map((it, i) => e("div", { key: i, className: "diary-row", style: { cursor: "default" } },
              e("span", { className: "diary-row__ic diary-row__ic--" + (it.tone || "") }, e(S.Icon, { name: it.icon, size: 14 })),
              e("div", { className: "diary-row__main" },
                e("div", { className: "diary-row__title" }, it.title),
                e("div", { className: "diary-row__meta" }, it.meta)
              ),
              e(S.Button, { size: "sm", variant: "ghost", iconOnly: true, icon: "check", "aria-label": "Hotovo" })
            ))
          ),

          // Expirace
          e("div", { className: "diary-section" },
            e("div", { className: "diary-section__head" },
              e("div", { className: "diary-section__title" },
                e(S.Icon, { name: "clock", size: 16 }),
                "Expirace smluv do 180 dnů",
                e("span", { className: "diary-section__count diary-section__count--warn" }, DIARY.expiring.length)
              ),
              e("a", { href: "./dms-smlouvy.html", className: "diary-section__link" }, "Všechny smlouvy →")
            ),
            DIARY.expiring.map((it, i) => e("a", { key: i, href: "./dms-smlouva-detail.html", className: "diary-row" },
              e("span", { className: "diary-row__ic diary-row__ic--" + (it.tone || "") }, e(S.Icon, { name: it.icon, size: 14 })),
              e("div", { className: "diary-row__main" },
                e("div", { className: "diary-row__title" }, it.title),
                e("div", { className: "diary-row__meta" }, it.meta)
              )
            ))
          )
        )
      )
    );
  }

  // ── Role body stubs (Sprint 4-5 will replace with real content) ──────────
  function ObchodHome() {
    return e(S.EmptyState, { title: "Obchodník home", description: "Sprint 4+ dodá sales pipeline + capacity-vs-pipeline + top 5 case action list." });
  }
  function VedouciVyrobyHome() {
    return e(S.EmptyState, { title: "Vedoucí výroby home", description: "Sprint 4+ dodá mini kapacita + rizikový list + deadliny." });
  }
  function AsistentkaHome() {
    return e(S.EmptyState, { title: "Asistentka home", description: "Sprint 5+ dodá AI frontu + docházku + emaily + úkoly." });
  }
  function PracovnikHome() {
    return e(S.EmptyState, { title: "Pracovník home", description: "Sprint 5+ dodá moje operace + rychlé vykázat + fond hodin." });
  }

  const ROLE_BODY = {
    "ceo": CEOHome,
    "obchodnik": ObchodHome,
    "vedouci-vyroby": VedouciVyrobyHome,
    "asistentka": AsistentkaHome,
    "pracovnik": PracovnikHome,
  };

  // ── Shell ─────────────────────────────────────────────────────────────────
  function Page() {
    const [role, setRole] = React.useState(() => {
      try { return localStorage.getItem('system21-role') || 'ceo'; } catch (_) { return 'ceo'; }
    });
    const Body = ROLE_BODY[role] || CEOHome;
    return e(S.AppShell, {
      sidebar: e(D.DemoSidebar, { active: "/" }),
      topbar: e(D.DemoTopBar, { crumbs: CRUMBS, onRoleChange: setRole }),
    },
      e(S.PageBody, null,
        e(Body)
      )
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(e(Page));
})();
</script>
</body>
</html>
