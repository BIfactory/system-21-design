<!doctype html>
<html lang="cs" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>System 21 · Dashboard</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../tokens/tokens.css">
<link rel="stylesheet" href="../dist/system21.css">
<script>(function(){try{var b=localStorage.getItem('system21-brand');if(b&&b!=='bifactory')document.documentElement.setAttribute('data-brand',b);var t=localStorage.getItem('system21-theme');if(t==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
<script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="../dist/system21.js"></script>
<script src="./_shared.js"></script>
<script src="./_shared-data.js"></script>
<style>
  .greeting { font: 800 28px/1.2 var(--font-display); color: var(--ink); letter-spacing: -.02em; }
  .greeting__sub { font: 400 15px/22px var(--font-body); color: var(--ink-muted); margin-top: 4px; }

  /* Main 2-col block */
  .s21-grid-main-aside { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4); }
  @media (max-width: 900px) { .s21-grid-main-aside { grid-template-columns: 1fr; } }

  /* Decide panel */
  .decide-panel { background: var(--surface-raised); border: 1px solid var(--border); border-radius: var(--radius-xl); overflow: hidden; }
  .decide-panel__head { display: flex; align-items: center; justify-content: space-between; padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--border-subtle); }
  .decide-panel__title { font: 600 14px/20px var(--font-body); color: var(--ink); display: flex; align-items: center; gap: var(--space-2); }
  .decide-row { display: flex; align-items: flex-start; gap: var(--space-3); padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--border-subtle); text-decoration: none; color: var(--ink); transition: background 100ms; }
  .decide-row:last-child { border-bottom: 0; }
  .decide-row:hover { background: var(--surface-muted); }
  .decide-row__ic { width: 32px; height: 32px; border-radius: var(--radius-full); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .decide-row__ic--warning { background: var(--warning-bg); color: var(--warning-text); }
  .decide-row__ic--primary { background: var(--primary-soft); color: var(--primary-text); }
  .decide-row__ic--default { background: var(--surface-muted); color: var(--ink-muted); }
  .decide-row__main { flex: 1; min-width: 0; }
  .decide-row__section { font: 500 10px/14px var(--font-mono); letter-spacing: .07em; text-transform: uppercase; color: var(--ink-muted); margin-bottom: 2px; }
  .decide-row__title { font: 500 14px/20px var(--font-body); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .decide-row__meta { font: 400 12px/16px var(--font-body); color: var(--ink-muted); }

  /* Activity / timeline */
  .activity-panel { background: var(--surface-raised); border: 1px solid var(--border); border-radius: var(--radius-xl); overflow: hidden; }
  .activity-panel__head { display: flex; align-items: center; justify-content: space-between; padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--border-subtle); }
  .activity-panel__title { font: 600 14px/20px var(--font-body); color: var(--ink); display: flex; align-items: center; gap: var(--space-2); }
  .tl { padding: var(--space-2) var(--space-4); }
  .tl-item { display: flex; align-items: flex-start; gap: var(--space-3); padding: var(--space-2) 0; position: relative; }
  .tl-item + .tl-item::before { content: ""; position: absolute; left: 15px; top: -8px; width: 2px; height: 8px; background: var(--border-subtle); }
  .tl-ic { width: 32px; height: 32px; border-radius: var(--radius-full); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .tl-ic--success { background: var(--success-bg, #d1fae5); color: var(--success-text, #065f46); }
  .tl-ic--primary { background: var(--primary-soft); color: var(--primary-text); }
  .tl-ic--default { background: var(--surface-muted); color: var(--ink-muted); }
  .tl-main { flex: 1; min-width: 0; }
  .tl-text { font: 400 13px/18px var(--font-body); color: var(--ink); }
  .tl-client { font: 400 12px/16px var(--font-body); color: var(--ink-muted); }
  .tl-time { font: 400 11px/16px var(--font-mono); color: var(--ink-subtle); flex-shrink: 0; }

  /* Lifecycle banner */
  .lifecycle-banner { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-4); background: linear-gradient(135deg, var(--primary-soft) 0%, var(--surface-raised) 60%); border-radius: var(--radius-xl); border: 1px solid var(--border); }
  .lc-step { flex: 1; display: flex; flex-direction: column; gap: 4px; padding: var(--space-3); background: var(--surface-raised); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); text-decoration: none; color: var(--ink); transition: background 150ms; }
  .lc-step:hover { background: var(--surface-muted); }
  .lc-step h3 { margin: 0; font: 500 11px/16px var(--font-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-muted); }
  .lc-num { font: 700 28px/32px var(--font-display); color: var(--primary-text); }
  .lc-sub { font: 400 12px/16px var(--font-body); color: var(--ink-muted); }
  .lc-arrow { color: var(--ink-subtle); flex-shrink: 0; }
  .lc-arrow-char { font: 700 24px/32px sans-serif; color: var(--ink-subtle); flex-shrink: 0; }
  @media (max-width: 767px) {
    .lifecycle-banner { flex-direction: column; }
    .lc-arrow { transform: rotate(90deg); }
    .lc-arrow-char { transform: rotate(90deg); }
    .lc-step { width: 100%; }
  }

  /* Hero progress bar */
  .ceo-hero { padding: var(--space-4); background: linear-gradient(135deg, var(--primary-soft) 0%, var(--surface-raised) 60%); border: 1px solid var(--border); border-radius: var(--radius-xl); display: flex; flex-direction: column; gap: var(--space-2); margin-bottom: var(--space-4); }
  .ceo-hero__label { font: 500 11px/16px var(--font-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-muted); }
  .ceo-hero__bar-wrap { padding: 8px 0; }
  .ceo-hero__bar { position: relative; height: 12px; background: var(--surface-muted); border-radius: var(--radius-full); overflow: hidden; }
  .ceo-hero__bar-fill { position: absolute; left: 0; top: 0; height: 100%; background: var(--success-solid); }
  .ceo-hero__bar-projected { position: absolute; top: 0; height: 100%; background: var(--success-solid); opacity: 0.35; }
  .ceo-hero__numbers { display: flex; gap: var(--space-4); font: 400 13px/18px var(--font-body); color: var(--ink-muted); flex-wrap: wrap; }
  .ceo-hero__numbers strong { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }

  /* Mini capacity widget */
  .cap-mini { display: flex; flex-direction: column; gap: 6px; }
  .cap-mini__row { display: grid; grid-template-columns: 160px 1fr 50px; align-items: center; gap: var(--space-3); font: 400 13px/18px var(--font-body); }
  .cap-mini__name { color: var(--ink); }
  .cap-mini__bar { height: 8px; background: var(--surface-muted); border-radius: var(--radius-full); overflow: hidden; }
  .cap-mini__fill { height: 100%; }
  .cap-mini__fill--empty { background: var(--surface-muted); }
  .cap-mini__fill--low { background: var(--warning-solid); }
  .cap-mini__fill--ok { background: var(--success-solid); }
  .cap-mini__fill--over { background: var(--danger-solid); }
  .cap-mini__pct { font-variant-numeric: tabular-nums; color: var(--ink-muted); text-align: right; }

  /* Obchodník: capacity-vs-pipeline callout */
  .cap-pipe { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-3) var(--space-4); border-radius: var(--radius-xl); border: 1px solid var(--border); background: var(--surface-raised); margin-bottom: var(--space-4); }
  .cap-pipe--warn { border-color: var(--warning-solid); background: var(--warning-bg); }
  .cap-pipe--ok { border-color: var(--border); background: var(--surface-raised); }
  .cap-pipe__ic { width: 36px; height: 36px; border-radius: var(--radius-full); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .cap-pipe--warn .cap-pipe__ic { background: color-mix(in oklab, var(--warning-solid) 25%, transparent); color: var(--warning-text); }
  .cap-pipe--ok .cap-pipe__ic { background: var(--primary-soft); color: var(--primary-text); }
  .cap-pipe__main { flex: 1; min-width: 0; }
  .cap-pipe__title { font: 500 14px/20px var(--font-body); color: var(--ink); }
  .cap-pipe__meta { font: 400 12px/16px var(--font-body); color: var(--ink-muted); margin-top: 2px; }

  /* Vedoucí výroby: mini kapacitní náhled (same structure as /vyroba/kapacita, inline) */
  .vv-cap-wrap { overflow-x: auto; }
  .vv-cap { width: 100%; border-collapse: separate; border-spacing: 2px; min-width: 640px; }
  .vv-cap th { padding: 6px 10px; font: 500 11px/16px var(--font-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-muted); text-align: left; }
  .vv-cap__name-col { width: 140px; }
  .vv-cap td { padding: 0; }
  .vv-cell { padding: 8px 10px; border-radius: var(--radius-md); cursor: pointer; display: flex; flex-direction: column; gap: 2px; min-height: 44px; }
  .vv-cell:hover { outline: 2px solid var(--primary); }
  .vv-cell--empty { background: var(--surface-muted); color: var(--ink-subtle); }
  .vv-cell--low { background: var(--warning-bg); color: var(--warning-text); }
  .vv-cell--ok { background: var(--success-bg); color: var(--success-text); }
  .vv-cell--over { background: var(--danger-bg); color: var(--danger-text); }
  .vv-cell__hours { font: 600 13px/16px var(--font-body); font-variant-numeric: tabular-nums; }
  .vv-cell__ops { font: 400 10px/12px var(--font-mono); opacity: 0.85; }
  .vv-cap__name-cell { padding: 8px 10px; font: 500 13px/18px var(--font-body); color: var(--ink); }
  .vv-cap__name-sub { font: 400 11px/14px var(--font-body); color: var(--ink-muted); }

  /* Obchodník: action-list (Co dnes dotáhnout + Nové poptávky) */
  .action-list { display: flex; flex-direction: column; gap: var(--space-2); }
  .action-row { display: flex; align-items: flex-start; gap: var(--space-3); padding: var(--space-3); background: var(--surface-raised); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); cursor: pointer; transition: background 100ms; text-decoration: none; color: var(--ink); }
  .action-row:hover { background: var(--surface-muted); }
  .action-row__main { flex: 1; min-width: 0; }
  .action-row__title { font: 500 14px/20px var(--font-body); color: var(--ink); display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
  .action-row__meta { font: 400 12px/16px var(--font-body); color: var(--ink-muted); display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; margin-top: 2px; }
  .action-row__meta .s21-cell-code { color: var(--ink-subtle); }
  .action-row__val { font: 600 14px/20px var(--font-body); font-variant-numeric: tabular-nums; color: var(--ink); white-space: nowrap; flex-shrink: 0; }
  .action-row__badge { margin-top: 4px; display: inline-block; }

</style>
</head>
<body>
<div id="root"></div>
<script>
(() => {
  const S = window.S21, D = window.S21Demo, e = React.createElement;
  const SD = window.S21Data;

  // ── Cross-cut KPI data from S21Data ───────────────────────────────────────
  const WP = SD.WEEKLY_PLAN;
  const openCases = SD.getOpenCases();
  const active = SD.getActiveOrders();
  const pipelineValue = openCases.reduce((s, c) => s + (c.value || 0), 0);
  const rozpracovanostKc = active.reduce((s, o) => s + (o.realHours * 1500), 0);
  const fmt = (n) => n.toLocaleString("cs-CZ").replace(/,/g, " ");

  // ── Greeting by hour ──────────────────────────────────────────────────────
  const hour = new Date().getHours();
  const greet = hour < 10 ? "Dobré ráno" : hour < 17 ? "Dobrý den" : "Dobrý večer";

  // ── Dnes rozhoduješ — mock curated feed ──────────────────────────────────
  const TODAY_DECIDE = [
    { icon: "info", tone: "warning", section: "VÝROBA", title: "ZAK-2026-0131 Napojení ERP → CRM — po termínu", meta: "Agro Slovácko · marže -4 %", href: "./zakazka-detail.html" },
    { icon: "users", tone: "primary", section: "OBCHOD", title: "OP-2026-0043 Moravia Steel — AI reporting", meta: "180 000 Kč pipeline · čeká na odpověď", href: "./crm-pripady.html" },
    { icon: "file", tone: "default", section: "DMS", title: "PL-2024-0067 Plyn — vyprší za 10 dnů", meta: "Hradecká strojírna · konec fixace 15. 11.", href: "./dms-smlouvy.html" },
    { icon: "tasks", tone: "default", section: "DMS", title: "3 emaily čekají na schválení (AI asistentka)", meta: "Nejnižší confidence 68 %", href: "./dms-automatizace.html" },
    { icon: "clock", tone: "primary", section: "ÚKOLY", title: "Zavolat Janu Novákovi o rozšíření úrazovky", meta: "deadline dnes", href: "./ukoly.html" },
  ];

  // ── Aktivita napříč firmou — timeline ─────────────────────────────────────
  const ACTIVITY = [
    { time: "10:42", icon: "check", tone: "success", text: "Smlouva SM-2026-089 podepsána", client: "Moravia Steel" },
    { time: "09:15", icon: "folder", tone: "primary", text: "Materiál M-01 vykázán na ZAK-2026-0131", client: "Alena D." },
    { time: "08:30", icon: "mail", tone: "default", text: "Nová poptávka od ing. Kříže", client: "Agro Slovácko" },
    { time: "včera 16:24", icon: "upload", tone: "default", text: "Nahrán cenník Allianz 2027", client: "AI asistentka" },
    { time: "včera 15:30", icon: "user", tone: "primary", text: "Nový pracovník Jana Svobodová nastoupí 17. 11.", client: null },
    { time: "včera 14:10", icon: "tasks", tone: "success", text: "3 úkoly dokončené", client: "Dvořákovi · Novákovi · Agro" },
  ];

  // ── Czech plural helpers (shared) ────────────────────────────────────────
  function pluralLide(n) { return n === 1 ? "člověk" : (n >= 2 && n <= 4 ? "lidé" : "lidí"); }
  function pluralDnu(n) { return n === 1 ? "den" : (n >= 2 && n <= 4 ? "dny" : "dnů"); }
  function pluralPripadu(n) { return n === 1 ? "případ" : (n >= 2 && n <= 4 ? "případy" : "případů"); }
  function pluralOtevrenyPripad(n) { return n === 1 ? "otevřený případ" : (n >= 2 && n <= 4 ? "otevřené případy" : "otevřených případů"); }

  // ── Sales-specific derivations (used by ObchodHome) ─────────────────────────
  const ALL_CASES = SD.CASES;
  const openCasesSales = SD.getOpenCases();
  const pipelineValueSales = openCasesSales.reduce((s, c) => s + (c.value || 0), 0);
  const wonCases = ALL_CASES.filter(c => c.stage === "won").length;
  const lostCases = ALL_CASES.filter(c => c.stage === "lost").length;
  const konverzeYTD = (wonCases + lostCases) > 0 ? Math.round(wonCases / (wonCases + lostCases) * 100) : 0;

  const SALES_STAGE_META = {
    "poptavka":            { label: "Poptávka" },
    "k-dodavateli":        { label: "K dodavateli" },
    "nabidka":             { label: "Nabídka" },
    "vyhodnoceni-nase":    { label: "Vyhodnocení (naše)" },
    "vyhodnoceni-klient":  { label: "Vyhodnocení (klient)" },
    "k-podpisu":           { label: "K podpisu" },
    "won":                 { label: "Podepsáno" },
    "lost":                { label: "Prohra" },
  };
  const SALES_FUNNEL_IDS = ["poptavka", "k-dodavateli", "nabidka", "vyhodnoceni-nase", "vyhodnoceni-klient", "k-podpisu", "won", "lost"];
  const SALES_FUNNEL = SALES_FUNNEL_IDS.map(id => {
    const cs = ALL_CASES.filter(c => c.stage === id);
    return { id, label: SALES_STAGE_META[id].label, count: cs.length, value: cs.reduce((s, c) => s + (c.value || 0), 0) };
  });

  // Priority score for "Co dnes dotáhnout"
  const SALES_TODAY = new Date(2026, 10, 7); // 2026-11-07
  function parseSalesDate(s) {
    if (!s || s === "—") return null;
    const p = s.replace(/\s/g, "").split(".");
    if (p.length < 3) return null;
    return new Date(parseInt(p[2], 10), parseInt(p[1], 10) - 1, parseInt(p[0], 10));
  }
  function salesPriority(c) {
    const dl = parseSalesDate(c.deadline);
    const dlDays = dl ? Math.round((dl - SALES_TODAY) / 86400000) : 999;
    const lcDays = c.lastContact && c.lastContact.match(/(\d+)/) ? parseInt(c.lastContact.match(/(\d+)/)[1], 10) : 0;
    return (dlDays < 7 ? 3 : 0) + (c.value > 150000 ? 2 : 0) + (lcDays > 5 ? 2 : 0);
  }
  const todayDotahnout = openCasesSales
    .map(c => ({ ...c, _p: salesPriority(c), _dlDays: parseSalesDate(c.deadline) ? Math.round((parseSalesDate(c.deadline) - SALES_TODAY) / 86400000) : null }))
    .sort((a, b) => b._p - a._p)
    .slice(0, 5);

  // ── Production-specific derivations (used by VedouciVyrobyHome) ──────────
  const PROD_TODAY_ISO = SD.WORKING_DAYS[0]; // mock "dnes" = 2026-11-09 (pondělí)
  const PROD_TODAY_LABEL = "pondělí 9. listopadu";
  const todayCapacity = SD.CAPACITY.filter(c => c.date === PROD_TODAY_ISO);
  const todayWorkerIds = [...new Set(todayCapacity.map(c => c.workerId))];
  const todayHoursPlanned = todayCapacity.reduce((s, c) => s + c.hours, 0);
  const todayHoursDone = Math.round(todayHoursPlanned * 0.37); // mock 37 % hotovo do poledne

  // Risk orders (reuse logic from /vyroba): top 5 by score
  const prodActive = SD.getActiveOrders();
  const prodRisky = prodActive
    .map(o => ({ o, score: SD.getRiskScore(o) }))
    .filter(x => x.score > 0)
    .sort((a, b) => b.score - a.score)
    .slice(0, 5);

  // Blížící se deadliny: active orders s deadline < 10 dnů
  const PROD_TODAY_DATE = new Date(2026, 10, 9); // 9. 11. 2026
  function parseProdDate(s) {
    if (!s || s === "—") return null;
    const p = s.replace(/\s/g, "").split(".");
    if (p.length < 3) return null;
    return new Date(parseInt(p[2], 10), parseInt(p[1], 10) - 1, parseInt(p[0], 10));
  }
  const prodDeadlines = prodActive
    .map(o => ({ o, dl: parseProdDate(o.deadline) }))
    .filter(x => x.dl)
    .map(x => ({ ...x, days: Math.round((x.dl - PROD_TODAY_DATE) / 86400000) }))
    .filter(x => x.days <= 10)
    .sort((a, b) => a.days - b.days)
    .slice(0, 5);

  // Nedokončené operace z včerejška (mock — operace bez done hodin)
  const PROD_OVERNIGHT = [
    { code: "OP-05", name: "Testy integrace", orderCode: "ZAK-2026-0131", worker: "Tomáš N.", planned: 8, done: 0, note: "včera 8h plán, vykázáno 0h" },
    { code: "OP-03", name: "Instalace panelů", orderCode: "ZAK-2026-0155", worker: "Pavel O.", planned: 16, done: 4, note: "přetáhnuto, zbývá 12h" },
    { code: "OP-06", name: "Dokumentace", orderCode: "ZAK-2026-0131", worker: "Pavel O.", planned: 4, done: 2, note: "čeká na schválení klientem" },
  ];

  // Mock: nové poptávky bez vlastníka (would come from inbox/forms in real system)
  const UNASSIGNED_LEADS = [
    { id: "L1", title: "Nová poptávka od ing. Kříže", source: "e-mail · agro.slovacko@domain.cz", age: "3 h", hint: "FVE 12 kWp" },
    { id: "L2", title: "Formulář z webu — Bouzkovi", source: "formulář · rekonstrukce koupelny", age: "1 d", hint: "orient. hodnota 180 000 Kč" },
  ];

  // Capacity-vs-pipeline chip values
  const workersForCap = SD.WORKERS.slice(0, 7);
  const avgWeekUtil = Math.round(
    workersForCap.reduce((ws, w) =>
      ws + SD.WORKING_DAYS.reduce((ds, d) => ds + SD.getUtilization(w.id, d), 0) / SD.WORKING_DAYS.length,
      0) / workersForCap.length
  );
  const freeCapPct = Math.max(0, 100 - avgWeekUtil);
  // Mock projection: when work ends without new acquisition
  const workEndDateLabel = "24. 12. 2026";

  const CRUMBS = [{ label: "Domů", href: "/" }];

  // ── CEOHome — hero + 4 KPI + mini kapacita + Dnes rozhoduješ + Aktivita + lifecycle ──
  function CEOHome() {
    return e("div", null,

      // ── 1. Hero progress bar ──────────────────────────────────────────
      e("div", { className: "ceo-hero" },
        e("div", { className: "ceo-hero__label" }, "Týdenní plán tržeb · " + WP.weekLabel),
        e("div", { className: "ceo-hero__bar-wrap" },
          e("div", { className: "ceo-hero__bar" },
            e("div", { className: "ceo-hero__bar-fill", style: { width: (WP.closedThisWeek / WP.target * 100) + "%" } }),
            e("div", { className: "ceo-hero__bar-projected", style: { left: (WP.closedThisWeek / WP.target * 100) + "%", width: ((WP.projectedClose - WP.closedThisWeek) / WP.target * 100) + "%" } })
          )
        ),
        e("div", { className: "ceo-hero__numbers" },
          e("span", null, e("strong", null, fmt(WP.closedThisWeek) + " Kč"), " uzavřeno"),
          e("span", null, "projekce ", e("strong", null, fmt(WP.projectedClose) + " Kč")),
          e("span", null, "cíl ", e("strong", null, fmt(WP.target) + " Kč"), " (" + Math.round(WP.closedThisWeek / WP.target * 100) + " %)")
        )
      ),

      // ── 2. Greeting ───────────────────────────────────────────────────
      e("div", null,
        e("h1", { className: "greeting" }, greet + ", Lubomíre"),
        e("p", { className: "greeting__sub" }, "Dnes je pátek 7. listopadu 2026 · tento měsíc máš " + fmt(487500) + " Kč v zakázkách")
      ),

      // ── 3. KPI pruh — 4 sales-focused tiles ──────────────────────────
      e(S.KpiRow, { cols: 4 },
        e(S.StatTile, {
          label: "Uzavřeno (týden)",
          value: fmt(WP.closedThisWeek),
          unit: "Kč",
          big: true,
          accent: "success",
        }),
        e(S.StatTile, {
          label: "Rozplánováno",
          value: fmt(WP.plannedThisWeek),
          unit: "Kč",
          hint: "do konce týdne",
        }),
        e(S.StatTile, {
          label: "Projekce konec týdne",
          value: fmt(WP.projectedClose),
          unit: "Kč",
          hint: Math.round(WP.projectedClose / WP.target * 100) + " % cíle",
        }),
        e(S.StatTile, {
          label: "Pipeline hodnota",
          value: fmt(pipelineValue),
          unit: "Kč",
          hint: openCases.length + " otevřených",
        })
      ),

      // ── 4. Mini capacity widget ───────────────────────────────────────
      e(S.Section, { title: "Utilizace kapacit (tento týden)" },
        e("div", { className: "cap-mini" },
          SD.WORKERS.slice(0, 7).map(w => {
            const weekUtil = Math.round(SD.WORKING_DAYS.reduce((s, d) => s + SD.getUtilization(w.id, d), 0) / SD.WORKING_DAYS.length);
            const tone = weekUtil === 0 ? "empty" : weekUtil < 60 ? "low" : weekUtil <= 110 ? "ok" : "over";
            return e("div", { key: w.id, className: "cap-mini__row" },
              e("div", { className: "cap-mini__name" }, w.name),
              e("div", { className: "cap-mini__bar" }, e("div", { className: "cap-mini__fill cap-mini__fill--" + tone, style: { width: Math.min(100, weekUtil) + "%" } })),
              e("div", { className: "cap-mini__pct" }, weekUtil + " %")
            );
          })
        )
      ),

      // ── 5. Hlavní 2-col blok ──────────────────────────────────────────
      e("div", { className: "s21-grid-main-aside" },

        // Levý panel — Dnes rozhoduješ
        e("div", { className: "decide-panel" },
          e("div", { className: "decide-panel__head" },
            e("div", { className: "decide-panel__title" },
              e(S.Icon, { name: "flag", size: 16 }),
              "Dnes rozhoduješ"
            )
          ),
          TODAY_DECIDE.map((item, i) =>
            e("a", { key: i, href: item.href, className: "decide-row" },
              e("span", { className: "decide-row__ic decide-row__ic--" + item.tone },
                e(S.Icon, { name: item.icon, size: 15 })
              ),
              e("div", { className: "decide-row__main" },
                e("div", { className: "decide-row__section" }, item.section),
                e("div", { className: "decide-row__title" }, item.title),
                e("div", { className: "decide-row__meta" }, item.meta)
              )
            )
          )
        ),

        // Pravý panel — Aktivita napříč firmou
        e("div", { className: "activity-panel" },
          e("div", { className: "activity-panel__head" },
            e("div", { className: "activity-panel__title" },
              e(S.Icon, { name: "activity", size: 16 }),
              "Aktivita napříč firmou"
            )
          ),
          e("div", { className: "tl" },
            ACTIVITY.map((item, i) =>
              e("div", { key: i, className: "tl-item" },
                e("span", { className: "tl-ic tl-ic--" + item.tone },
                  e(S.Icon, { name: item.icon, size: 14 })
                ),
                e("div", { className: "tl-main" },
                  e("div", { className: "tl-text" }, item.text),
                  item.client && e("div", { className: "tl-client" }, item.client)
                ),
                e("div", { className: "tl-time" }, item.time)
              )
            )
          )
        )
      ),

      // ── 6. Lifecycle banner ───────────────────────────────────────────
      e("div", { className: "lifecycle-banner" },
        e("a", { className: "lc-step", href: "./crm-pripady.html" },
          e("h3", null, "V jednání"),
          e("div", { className: "lc-num" }, String(openCases.length)),
          e("div", { className: "lc-sub" }, fmt(pipelineValue) + " Kč pipeline")
        ),
        e("span", { className: "lc-arrow-char" }, "→"),
        e("a", { className: "lc-step", href: "./zakazky.html" },
          e("h3", null, "V realizaci"),
          e("div", { className: "lc-num" }, String(active.length)),
          e("div", { className: "lc-sub" }, fmt(rozpracovanostKc) + " Kč rozpracováno")
        ),
        e("span", { className: "lc-arrow-char" }, "→"),
        e("a", { className: "lc-step", href: "./zakazky.html" },
          e("h3", null, "Dokončeno YTD"),
          e("div", { className: "lc-num" }, String(SD.ORDERS.filter(o => o.status === "done" || o.status === "delivered").length)),
          e("div", { className: "lc-sub" }, fmt(SD.ORDERS.filter(o => o.status === "done" || o.status === "delivered").reduce((s, o) => s + (o.priceOffer || 0), 0)) + " Kč fakturováno")
        )
      )
    );
  }

  // ── ObchodHome — pipeline + capacity-vs-pipeline chip + funnel + action lists ──
  function ObchodHome() {
    const warn = freeCapPct > 50;
    return e("div", null,

      // ── 1. Greeting ────────────────────────────────────────────
      e("div", null,
        e("h1", { className: "greeting" }, greet + ", Pavle"),
        e("p", { className: "greeting__sub" },
          "Pipeline ", e("strong", { style: { color: "var(--ink)", fontVariantNumeric: "tabular-nums" } }, fmt(pipelineValueSales) + " Kč"),
          " · ", String(openCasesSales.length) + " " + pluralOtevrenyPripad(openCasesSales.length),
          " · konverze YTD ", e("strong", { style: { color: "var(--ink)" } }, konverzeYTD + " %"))
      ),

      // ── 2. KPI pruh ────────────────────────────────────────────
      e(S.KpiRow, { cols: 4, style: { marginTop: "var(--space-4)" } },
        e(S.StatTile, { label: "Pipeline hodnota", value: fmt(pipelineValueSales), unit: "Kč", big: true, accent: "primary" }),
        e(S.StatTile, { label: "Otevřených případů", value: String(openCasesSales.length), hint: "čeká na akci" }),
        e(S.StatTile, { label: "Podepsáno YTD", value: fmt(ALL_CASES.filter(c => c.stage === "won").reduce((s, c) => s + (c.value || 0), 0)), unit: "Kč", hint: wonCases + " případů" }),
        e(S.StatTile, { label: "Konverze (YTD)", value: konverzeYTD + " %", hint: "podepsáno / uzavřených" })
      ),

      // ── 3. Capacity-vs-pipeline chip ─────────────────────────────
      e("div", { style: { marginTop: "var(--space-4)" } },
        e("div", { className: "cap-pipe " + (warn ? "cap-pipe--warn" : "cap-pipe--ok") },
          e("div", { className: "cap-pipe__ic" }, e(S.Icon, { name: warn ? "info" : "check", size: 18 })),
          e("div", { className: "cap-pipe__main" },
            e("div", { className: "cap-pipe__title" },
              warn
                ? "Výroba volná " + freeCapPct + " % — pokud nic nenaberu, končí práce " + workEndDateLabel
                : "Výroba vytížená na " + avgWeekUtil + " % — dej si pauzu s akvizicí"
            ),
            e("div", { className: "cap-pipe__meta" },
              warn
                ? "Zaměř se na uzavření pipeline nebo nové poptávky."
                : "Riziko: nové zakázky by neuvezli — nejdřív doručit rozjeté."
            )
          )
        )
      ),

      // ── 4. Sales funnel ─────────────────────────────────────────
      e("div", { style: { marginTop: "var(--space-4)" } },
        e(S.Section, { title: "Pipeline — fáze obchodního případu" },
          e(S.SalesFunnel, { stages: SALES_FUNNEL })
        )
      ),

      // ── 5. 2-col: Co dnes dotáhnout + Nové poptávky ──────────────
      e("div", { className: "s21-grid-main-aside", style: { marginTop: "var(--space-4)" } },

        // Levý: Co dnes dotáhnout (top 5)
        e(S.Section, { title: "Co dnes dotáhnout" },
          todayDotahnout.length === 0
            ? e(S.EmptyState, { icon: "check", title: "Nic nehoří", description: "Žádný otevřený případ nevyžaduje okamžitou akci." })
            : e("div", { className: "action-list" },
                todayDotahnout.map(c =>
                  e("a", { key: c.id, className: "action-row", href: "./crm-pripady.html" },
                    e("div", { className: "action-row__main" },
                      e("div", { className: "action-row__title" }, c.name),
                      e("div", { className: "action-row__meta" },
                        e("span", { className: "s21-cell-code" }, c.code),
                        e("span", null, "·"),
                        e("span", null, c.client),
                        e("span", null, "·"),
                        e("span", null, c._dlDays != null && c._dlDays < 7
                          ? (c._dlDays <= 0 ? "deadline dnes / po" : "za " + c._dlDays + " " + pluralDnu(c._dlDays))
                          : "kontakt před " + (c.lastContact || "? dny"))
                      ),
                      e(S.Badge, {
                        tone: c._dlDays != null && c._dlDays < 3 ? "danger" : c.value > 150000 ? "warning" : "neutral",
                        style: { marginTop: 6 }
                      }, SALES_STAGE_META[c.stage] ? SALES_STAGE_META[c.stage].label : c.stage)
                    ),
                    e("div", { className: "action-row__val" }, fmt(c.value) + " Kč")
                  )
                )
              )
        ),

        // Pravý: Nové poptávky bez vlastníka
        e(S.Section, { title: "Nové poptávky bez vlastníka" },
          UNASSIGNED_LEADS.length === 0
            ? e(S.EmptyState, { icon: "check", title: "Vše přiřazeno", description: "Žádné nové poptávky nečekají." })
            : e("div", { className: "action-list" },
                UNASSIGNED_LEADS.map(l =>
                  e("a", { key: l.id, className: "action-row", href: "./crm-pripady.html" },
                    e("div", { className: "action-row__main" },
                      e("div", { className: "action-row__title" }, l.title),
                      e("div", { className: "action-row__meta" },
                        e("span", null, l.source),
                        e("span", null, "·"),
                        e("span", null, "před " + l.age)
                      ),
                      e(S.Badge, { tone: "primary", style: { marginTop: 6 } }, l.hint)
                    ),
                    e("div", { className: "action-row__val" },
                      e(S.Button, { size: "sm", variant: "secondary" }, "Převzít")
                    )
                  )
                )
              )
        )
      ),

      // ── 6. Footer links ─────────────────────────────────────────
      e("div", { style: { display: "flex", gap: "var(--space-3)", marginTop: "var(--space-4)", flexWrap: "wrap" } },
        e(S.Button, { variant: "ghost", onClick: () => window.location.href = "./crm-pripady.html" }, "→ Všechny případy"),
        e(S.Button, { variant: "ghost", onClick: () => window.location.href = "./crm-klienti.html" }, "→ Klienti"),
        e(S.Button, { variant: "ghost", onClick: () => window.location.href = "./crm-osoby.html" }, "→ Osoby")
      )
    );
  }
  // ── VedouciVyrobyHome — today-stat + mini kapacita + risk + deadliny ──
  function VedouciVyrobyHome() {
    const DAY_NAMES = ["Ne", "Po", "Út", "St", "Čt", "Pá", "So"];
    function dayLabel(iso) {
      const [y, m, d] = iso.split("-").map(Number);
      const dt = new Date(y, m - 1, d);
      return DAY_NAMES[dt.getDay()] + " " + d + ". " + m + ".";
    }
    return e("div", null,

      // ── 1. Greeting ────────────────────────────────────────────
      e("div", null,
        e("h1", { className: "greeting" }, greet + ", Pavle"),
        e("p", { className: "greeting__sub" },
          "Dnes ", e("strong", { style: { color: "var(--ink)" } }, PROD_TODAY_LABEL),
          " · ", e("strong", { style: { color: "var(--ink)" } }, String(todayWorkerIds.length) + " " + pluralLide(todayWorkerIds.length) + " v práci"),
          " · ", e("strong", { style: { color: "var(--ink)" } }, todayHoursPlanned + " h naplánováno"),
          " · odpracováno ", e("strong", { style: { color: "var(--ink)" } }, todayHoursDone + " h"))
      ),

      // ── 2. Mini kapacitní náhled (7×5) ────────────────────────
      e("div", { style: { marginTop: "var(--space-4)" } },
        e(S.Section, {
          title: "Kapacita tento týden",
          action: e(S.Button, {
            variant: "ghost", size: "sm", icon: "arrow-right",
            onClick: () => window.location.href = "./vyroba-kapacita.html"
          }, "Full plánovač")
        },
          e("div", { className: "vv-cap-wrap" },
            e("table", { className: "vv-cap" },
              e("thead", null,
                e("tr", null,
                  e("th", { className: "vv-cap__name-col" }, "Pracovník"),
                  ...SD.WORKING_DAYS.map(d => e("th", { key: d }, dayLabel(d)))
                )
              ),
              e("tbody", null,
                SD.WORKERS.filter(w => w.state === "in-progress").map(w => e("tr", { key: w.id },
                  e("td", { className: "vv-cap__name-col" },
                    e("div", { className: "vv-cap__name-cell" }, w.name,
                      e("div", { className: "vv-cap__name-sub" }, w.position)
                    )
                  ),
                  ...SD.WORKING_DAYS.map(d => {
                    const u = SD.getUtilization(w.id, d);
                    const assigned = SD.getCapacityForWeek(w.id, d);
                    const tone = u === 0 ? "empty" : u < 60 ? "low" : u <= 110 ? "ok" : "over";
                    const hours = assigned.reduce((s, c) => s + c.hours, 0);
                    return e("td", { key: d },
                      e("div", {
                        className: "vv-cell vv-cell--" + tone,
                        title: hours + " h · " + u + " %",
                        onClick: () => window.location.href = "./vyroba-kapacita.html"
                      },
                        e("div", { className: "vv-cell__hours" }, hours ? hours + " h" : "—"),
                        assigned.length > 0 && e("div", { className: "vv-cell__ops" }, assigned.map(a => a.operationCode).join(" · "))
                      )
                    );
                  })
                ))
              )
            )
          )
        )
      ),

      // ── 3. 2-col: Zakázky v riziku + Blížící se deadliny ──────
      e("div", { className: "s21-grid-main-aside", style: { marginTop: "var(--space-4)" } },

        // Levý: Zakázky v riziku
        e(S.Section, { title: "Zakázky v riziku" },
          prodRisky.length === 0
            ? e(S.EmptyState, { icon: "check", title: "Vše v normě", description: "Žádná zakázka v riziku." })
            : e("div", { className: "action-list" },
                prodRisky.map(({ o, score }) =>
                  e("a", { key: o.id, className: "action-row", href: "./zakazka-detail.html" },
                    e("div", { className: "action-row__main" },
                      e("div", { className: "action-row__title" }, o.name),
                      e("div", { className: "action-row__meta" },
                        e("span", { className: "s21-cell-code" }, o.code),
                        e("span", null, "·"),
                        e("span", null, o.client),
                        e("span", null, "·"),
                        e("span", null, o.realHours + "/" + o.plannedHours + " h")
                      ),
                      e(S.Badge, {
                        tone: o.overdue ? "danger" : (o.margin != null && o.margin < 15) ? "warning" : (o.missingDocs ? "warning" : "neutral"),
                        style: { marginTop: 6 }
                      }, o.overdue ? "po termínu" : (o.margin != null && o.margin < 15) ? "nízká marže " + o.margin + " %" : (o.missingDocs ? "chybí podklady" : "riziko +" + score))
                    ),
                    e("div", { className: "action-row__val" }, o.priceOffer ? fmt(o.priceOffer) + " Kč" : "—")
                  )
                )
              )
        ),

        // Pravý: Blížící se deadliny
        e(S.Section, { title: "Blížící se deadliny (< 10 dnů)" },
          prodDeadlines.length === 0
            ? e(S.EmptyState, { icon: "check", title: "Žádné deadliny", description: "V dalších 10 dnech nic nekončí." })
            : e("div", { className: "action-list" },
                prodDeadlines.map(({ o, days }) =>
                  e("a", { key: o.id, className: "action-row", href: "./zakazka-detail.html" },
                    e("div", { className: "action-row__main" },
                      e("div", { className: "action-row__title" }, o.name),
                      e("div", { className: "action-row__meta" },
                        e("span", { className: "s21-cell-code" }, o.code),
                        e("span", null, "·"),
                        e("span", null, o.client),
                        e("span", null, "·"),
                        e("span", null, o.deadline)
                      ),
                      e(S.Badge, {
                        tone: days < 0 ? "danger" : days <= 3 ? "warning" : "neutral",
                        style: { marginTop: 6 }
                      }, days < 0 ? Math.abs(days) + " " + pluralDnu(Math.abs(days)) + " po termínu" : days === 0 ? "dnes" : "za " + days + " " + pluralDnu(days))
                    ),
                    e("div", { className: "action-row__val" }, Math.round((o.realHours / o.plannedHours) * 100) + " %")
                  )
                )
              )
        )
      ),

      // ── 4. Nedokončené operace z včerejška ────────────────────
      e("div", { style: { marginTop: "var(--space-4)" } },
        e(S.Section, { title: "Nedokončené operace z včerejška" },
          e("div", { className: "action-list" },
            PROD_OVERNIGHT.map((op, i) =>
              e("div", { key: i, className: "action-row", style: { cursor: "default" } },
                e("div", { className: "action-row__main" },
                  e("div", { className: "action-row__title" }, op.code + " · " + op.name),
                  e("div", { className: "action-row__meta" },
                    e("span", { className: "s21-cell-code" }, op.orderCode),
                    e("span", null, "·"),
                    e("span", null, op.worker),
                    e("span", null, "·"),
                    e("span", null, op.note)
                  )
                ),
                e("div", { className: "action-row__val" }, op.done + " / " + op.planned + " h")
              )
            )
          )
        )
      ),

      // ── 5. Footer links ─────────────────────────────────────────
      e("div", { style: { display: "flex", gap: "var(--space-3)", marginTop: "var(--space-4)", flexWrap: "wrap" } },
        e(S.Button, { variant: "ghost", onClick: () => window.location.href = "./vyroba-kapacita.html" }, "→ Full plánovač"),
        e(S.Button, { variant: "ghost", onClick: () => window.location.href = "./vykazovani.html" }, "→ Vykazování týmu"),
        e(S.Button, { variant: "ghost", onClick: () => window.location.href = "./zakazky.html" }, "→ Všechny zakázky")
      )
    );
  }
  function AsistentkaHome() {
    return e(S.EmptyState, { title: "Asistentka home", description: "Sprint 5+ dodá AI frontu + docházku + emaily + úkoly." });
  }
  function PracovnikHome() {
    return e(S.EmptyState, { title: "Pracovník home", description: "Sprint 5+ dodá moje operace + rychlé vykázat + fond hodin." });
  }

  const ROLE_BODY = {
    "ceo": CEOHome,
    "obchodnik": ObchodHome,
    "vedouci-vyroby": VedouciVyrobyHome,
    "asistentka": AsistentkaHome,
    "pracovnik": PracovnikHome,
  };

  // ── Shell ─────────────────────────────────────────────────────────────────
  function Page() {
    const [role, setRole] = React.useState(() => {
      try { return localStorage.getItem('system21-role') || 'ceo'; } catch (_) { return 'ceo'; }
    });
    const Body = ROLE_BODY[role] || CEOHome;
    return e(S.AppShell, {
      sidebar: e(D.DemoSidebar, { active: "/" }),
      topbar: e(D.DemoTopBar, { crumbs: CRUMBS, onRoleChange: setRole }),
    },
      e(S.PageBody, null,
        e(Body)
      )
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(e(Page));
})();
</script>
</body>
</html>
