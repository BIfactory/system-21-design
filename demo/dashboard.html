<!doctype html>
<html lang="cs" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>System 21 · Dashboard</title>
<link rel="stylesheet" href="../tokens/tokens.css">
<link rel="stylesheet" href="../dist/system21.css">
<script>
  (function(){
    try {
      var b = localStorage.getItem('system21-brand');
      if (b && b !== 'bifactory') document.documentElement.setAttribute('data-brand', b);
      var t = localStorage.getItem('system21-theme');
      if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
    } catch(e){}
  })();
</script>
<script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="../dist/system21.js"></script>
<script src="./_shared.js"></script>
</head>
<body>
<div id="root"></div>
<script>
(() => {
  const S = window.S21, D = window.S21Demo, e = React.createElement;

  const FEED = [
    { id: 1, actor: { name: "Alena Dvořáková" }, action: "podepsala smlouvu", target: "SM-2026-089 Moravia Steel", timestamp: "před 1 h" },
    { id: 2, actor: { name: "Pavel Obdržálek" }, action: "založil zakázku", target: "ZAK-2026-0142 Reporting obchodu", timestamp: "před 2 h" },
    { id: 3, actor: { name: "Systém" }, icon: "bell", action: "upozorňuje: 3 smlouvy vyprší do 30 dnů", timestamp: "před 3 h" },
    { id: 4, actor: { name: "Tomáš Novák" }, action: "přidal poznámku k", target: "Novákovi / rodina", timestamp: "před 5 h" },
    { id: 5, actor: { name: "Alena Dvořáková" }, action: "označila úkol hotový:", target: "Zavolat klientovi Agro Slovácko", timestamp: "včera" },
    { id: 6, actor: { name: "Pavel Obdržálek" }, action: "importoval faktury z banky", target: "9 nových položek", timestamp: "včera" },
  ];

  const ACTIONS = [
    { label: "Nová zakázka", icon: "plus", onClick: () => {} },
    { label: "Nový úkol", icon: "tasks", onClick: () => {} },
    { label: "Nová smlouva", icon: "file", onClick: () => {} },
    { label: "Nový klient", icon: "user-plus", onClick: () => {} },
    { label: "Nový dokument", icon: "paperclip", onClick: () => {}, badge: 3 },
    { label: "Nová osoba", icon: "users", onClick: () => {} },
  ];

  const CRUMBS = [{ label: "Dashboard", href: "/dashboard" }];

  function Page() {
    const [dismissed, setDismissed] = React.useState({});
    const [aiOpen, setAiOpen] = React.useState(false);
    const [messages, setMessages] = React.useState([]);
    const [loading, setLoading] = React.useState(false);
    const sendAI = (text) => {
      const id = Date.now();
      setMessages((prev) => [...prev, { id, role: "user", content: text }]);
      setLoading(true);
      setTimeout(() => {
        setMessages((prev) => [...prev, { id: id + 1, role: "assistant", content: "Dobře. Tady je přehled: 124 klientů, 208 aktivních smluv, 7 otevřených příležitostí. Chceš se podívat na nějakou konkrétní oblast?" }]);
        setLoading(false);
      }, 900);
    };
    return e(S.AppShell, {
      sidebar: e(D.DemoSidebar, { active: "/dashboard" }),
      topbar: e(D.DemoTopBar, { crumbs: CRUMBS }),
    },
      e(S.PageBody, null,
        e("div", { style: { display: "flex", flexDirection: "column", gap: "var(--space-3)", marginBottom: "var(--space-5)" } },
          !dismissed[1] && e(S.AISuggestion, {
            title: "Vykázat hodiny za včerejšek?",
            description: "Včera jsi strávil 6 h na ZAK-2026-0131 (podle kalendáře a aktivity). Chceš je vykázat jedním klikem?",
            confidence: 92,
            onDismiss: () => setDismissed((d) => ({ ...d, 1: true })),
            actions: e(React.Fragment, null,
              e(S.Button, { size: "sm", icon: "check" }, "Vykázat 6 h"),
              e(S.Button, { size: "sm", variant: "ghost" }, "Upravit")
            )
          }),
          !dismissed[2] && e(S.AISuggestion, {
            title: "3 smlouvy expirují do 30 dnů",
            description: "Novákovi · Hradecká strojírna · Procházkovi. Doporučuji zavolat klientům s předstihem.",
            confidence: 100,
            onDismiss: () => setDismissed((d) => ({ ...d, 2: true })),
            actions: e(React.Fragment, null,
              e(S.Button, { size: "sm" }, "Zobrazit smlouvy"),
              e(S.Button, { size: "sm", variant: "ghost" }, "Vytvořit úkoly")
            )
          })
        ),
        e(S.ModuleHome, {
          title: "Dashboard",
          description: "Co se dnes děje v tvojí praxi",
          kpis: e(S.KpiRow, { cols: 4 },
            e(S.StatTile, { label: "Klienti", value: "124", hint: "Rodiny 92 · Firmy 32", accent: "primary", href: "./crm-klienti.html" }),
            e(S.StatTile, { label: "Smlouvy", value: "208", hint: "tento měsíc +3", href: "./dms-smlouvy.html" }),
            e(S.StatTile, { label: "Otevřené příležitosti", value: "7", accent: "primary", href: "./crm-obchodni-pripady.html" }),
            e(S.StatTile, { label: "Nepodepsané smlouvy", value: "2", accent: "danger", hint: "čeká na akci", href: "./dms-smlouvy.html" })
          ),
          quickActions: e(S.QuickActions, { actions: ACTIONS, cols: 3 }),
          activity: e(S.ActivityFeed, { items: FEED }),
          diary: e(S.Section, { title: "Deník dne" },
            e("ul", { style: { margin: 0, paddingLeft: 18, font: "400 14px/22px var(--font-body)", color: "var(--ink)" } },
              e("li", null, "3 smlouvy vyprší do 30 dnů"),
              e("li", null, "2 úkoly po termínu"),
              e("li", null, "1 nová zpráva v mailu"),
              e("li", null, "ÁJA čeká na potvrzení 4 dokumentů")
            )
          ),
        }),
        e("button", {
          type: "button",
          onClick: () => setAiOpen(true),
          style: { position: "fixed", bottom: "var(--space-5)", right: "var(--space-5)", width: 56, height: 56, borderRadius: "var(--radius-full)", background: "linear-gradient(135deg, #8b5cf6, #6366f1, #06b6d4)", color: "white", border: 0, boxShadow: "var(--elev-5)", cursor: "pointer", display: "inline-flex", alignItems: "center", justifyContent: "center", zIndex: 40 },
          "aria-label": "Otevřít AI asistentku",
          title: "AI asistentka"
        }, e(S.Icon, { name: "sparkles", size: 24 })),
        e(S.AIPanel, {
          open: aiOpen,
          onClose: () => setAiOpen(false),
          context: { label: "Kontext:", value: "Dashboard" },
          suggestedPrompts: [
            { label: "Shrň mi dnešek", prompt: "Shrň aktuální stav mé praxe", icon: "sparkles" },
            { label: "Co mám dnes dělat?", prompt: "Co mám dnes dělat?", icon: "tasks" },
            { label: "Naplánuj tento týden", prompt: "Pomož mi naplánovat tento týden", icon: "calendar" },
          ],
          messages,
          onSend: sendAI,
          loading,
        })
      )
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(e(Page));
})();
</script>
</body>
</html>
