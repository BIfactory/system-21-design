<!doctype html>
<html lang="cs" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>System 21 · CRM Klienti</title>
<link rel="stylesheet" href="../tokens/tokens.css">
<link rel="stylesheet" href="../dist/system21.css">
<script>
  (function(){ try { var b=localStorage.getItem('system21-brand'); if(b&&b!=='bifactory')document.documentElement.setAttribute('data-brand',b); var t=localStorage.getItem('system21-theme'); if(t==='dark')document.documentElement.setAttribute('data-theme','dark'); } catch(e){} })();
</script>
<script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="../dist/system21.js"></script>
<script src="./_shared.js"></script>
</head>
<body>
<div id="root"></div>
<script>
(() => {
  const S = window.S21, D = window.S21Demo, e = React.createElement;

  const CLIENTS = [
    { id: 1, name: "Novákovi", type: "Rodina", segment: "VIP", contracts: 3, lastContact: "12. 10. 2026" },
    { id: 2, name: "Moravia Steel a.s.", type: "Firma", segment: "B2B", contracts: 8, lastContact: "08. 10. 2026" },
    { id: 3, name: "Dvořákovi", type: "Rodina", segment: "Standard", contracts: 2, lastContact: "02. 10. 2026" },
    { id: 4, name: "Agro Slovácko s.r.o.", type: "Firma", segment: "B2B", contracts: 4, lastContact: "28. 09. 2026" },
    { id: 5, name: "Procházkovi", type: "Rodina", segment: "Standard", contracts: 1, lastContact: "25. 09. 2026" },
    { id: 6, name: "Hradecká strojírna s.r.o.", type: "Firma", segment: "B2B", contracts: 6, lastContact: "20. 09. 2026" },
    { id: 7, name: "Svobodovi", type: "Rodina", segment: "VIP", contracts: 5, lastContact: "15. 09. 2026" },
  ];

  const COLUMNS = [
    { key: "name", label: "Jméno", sortable: true, width: "40%", render: (c) =>
      e("div", null,
        e("div", { className: "s21-cell-title" }, c.name),
        e("div", { className: "s21-cell-meta" }, c.segment + " · ID " + String(c.id).padStart(5, "0"))
      )
    },
    { key: "type", label: "Typ", width: "15%" },
    { key: "contracts", label: "Smlouvy", align: "right", numeric: true, width: "15%" },
    { key: "lastContact", label: "Poslední kontakt", align: "right", numeric: true, width: "22%" },
    { key: "actions", label: "", align: "center", width: "8%", render: () =>
      e("span", { className: "s21-row-actions", "data-no-row-click": true },
        e(S.Button, { size: "sm", iconOnly: true, icon: "edit", "aria-label": "Upravit", title: "Upravit" }),
        e(S.Button, { size: "sm", variant: "secondary", iconOnly: true, icon: "more", "aria-label": "Víc", title: "Víc" })
      )
    }
  ];

  const CRUMBS = [{ label: "CRM", href: "/crm/klienti" }, { label: "Klienti", href: "/crm/klienti" }];

  function Page() {
    const [tab, setTab] = React.useState("vsichni");
    const [q, setQ] = React.useState("");
    return e(S.AppShell, {
      sidebar: e(D.DemoSidebar, { active: "/crm/klienti" }),
      topbar: e(D.DemoTopBar, { crumbs: CRUMBS }),
    },
      e(S.PageHeader, {
        title: "Klienti",
        description: "Rodiny a firmy, se kterými pracujeme",
        actions: e(React.Fragment, null,
          e(S.Button, { variant: "secondary", icon: "download" }, "Export"),
          e(S.Button, { icon: "plus" }, "Nový klient")
        ),
        tabs: e(S.Tabs, { value: tab, onChange: setTab, items: [
          { value: "vsichni", label: "Všichni", count: 124 },
          { value: "rodiny", label: "Rodiny", count: 92 },
          { value: "firmy", label: "Firmy", count: 32 },
        ] })
      }),
      e(S.PageBody, null,
        e(S.KpiRow, { cols: 4 },
          e(S.StatTile, { label: "Celkem klientů", value: "124" }),
          e(S.StatTile, { label: "Nových tento měsíc", value: "7", accent: "success" }),
          e(S.StatTile, { label: "Aktivních smluv", value: "208" }),
          e(S.StatTile, { label: "Expirace do 30 dnů", value: "3", accent: "warning" })
        ),
        e(S.FilterBar, null,
          e(S.SearchInput, { className: "s21-grow", value: q, onChange: setQ, placeholder: "Hledat jméno, firmu, IČ…" }),
          e(S.Select, { placeholder: "Všechny stavy", options: [
            { value: "aktivni", label: "Aktivní" }, { value: "vip", label: "VIP" }, { value: "pasivni", label: "Pasivní" }
          ] }),
          e(S.Select, { placeholder: "Všechny segmenty", options: [
            { value: "std", label: "Standard" }, { value: "b2b", label: "B2B" }, { value: "prem", label: "Premium" }
          ] }),
          e(S.Select, { placeholder: "Všechny kraje", options: [
            { value: "jmk", label: "Jihomoravský" }, { value: "zlk", label: "Zlínský" }, { value: "stc", label: "Středočeský" }
          ] })
        ),
        e(S.DataTable, { columns: COLUMNS, rows: CLIENTS, onRowClick: () => { window.location.href = "./crm-klient-detail.html"; }, minWidth: 820 })
      )
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(e(Page));
})();
</script>
</body>
</html>
