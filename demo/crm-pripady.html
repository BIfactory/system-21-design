<!doctype html>
<html lang="cs" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>System 21 · Obchodní případy</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../tokens/tokens.css">
<link rel="stylesheet" href="../dist/system21.css">
<script>(function(){try{var b=localStorage.getItem('system21-brand');if(b&&b!=='bifactory')document.documentElement.setAttribute('data-brand',b);var t=localStorage.getItem('system21-theme');if(t==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
<script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="../dist/system21.js"></script>
<script src="./_shared.js"></script>
<script src="./_shared-data.js"></script>
</head>
<body>
<div id="root"></div>
<script>
(() => {
  const S = window.S21, D = window.S21Demo, e = React.createElement;

  // Poema features.md Scénář 3 pipeline (6 stavů):
  // 1. Poptávka od zák. → 2. Poptávka k dodavateli → 3. Vyhodnocení (naše strana)
  // → 4. Vyhodnocení (klient) → 5. Smlouva k podpisu → 6. Podepsáno / Zrušeno
  const STAGE_LABELS = {
    poptavka: "Poptávka", "k-dodavateli": "K dodavateli", nabidka: "Nabídka poslána",
    "vyhodnoceni-nase": "Vyhodnocení (naše)", "vyhodnoceni-klient": "Vyhodnocení (klient)",
    "k-podpisu": "K podpisu", won: "Podepsáno", lost: "Prohra",
    // legacy aliases used in S21Data
    customer_eval: "Vyhodnocení (klient)", negotiation: "Vyhodnocení (naše)",
  };
  // mock mails/offers per case code (augmentation layer)
  const CASE_AUG = {
    "OP-2026-0045": { mails: 3, offers: 2 },
    "OP-2026-0043": { mails: 7, offers: 4 },
    "OP-2026-0041": { mails: 5, offers: 3 },
    "OP-2026-0039": { mails: 2, offers: 0 },
    "OP-2026-0037": { mails: 1, offers: 0 },
  };
  const CASES = window.S21Data.CASES.map((c) => ({
    ...c,
    title: c.name,
    stageLabel: STAGE_LABELS[c.stage] || c.stage,
    deadline: c.deadline || "—",
    mails: (CASE_AUG[c.code] || {}).mails || 0,
    offers: (CASE_AUG[c.code] || {}).offers || 0,
  }));

  const fmt = (n) => n.toLocaleString("cs-CZ").replace(/,/g, " ");
  function stageTone(s) {
    if (s === "won") return "success";
    if (s === "lost") return "danger";
    if (s === "negotiation" || s === "customer_eval" || s === "vyhodnoceni-klient") return "warning";
    return "primary";
  }

  const COLUMNS = [
    { key: "code", label: "Případ", sortable: true, width: "28%", render: (c) =>
      e("div", null,
        e("div", { style: { display: "flex", alignItems: "center", gap: 6 } },
          e(S.Icon, { name: c.clientKind === "family" ? "users" : "building", size: 14 }),
          e("span", { className: "s21-cell-title" }, c.title)
        ),
        e("div", { className: "s21-cell-meta" }, e("span", { className: "s21-cell-code" }, c.code), " · ", c.client, " · ", c.owner)
      )
    },
    { key: "stage", label: "Fáze", width: "20%", render: (c) => {
      const linkedOrder = c.stage === "won" && window.S21Data && window.S21Data.getOrderByCase(c.code) || null;
      return e("div", { style: { display: "flex", alignItems: "center", gap: "var(--space-2)" } },
        e(S.Badge, { tone: stageTone(c.stage), fitCell: true }, c.stageLabel),
        linkedOrder && e("a", {
          href: "./zakazka-detail.html",
          style: { marginLeft: 4, display: "inline-flex", alignItems: "center", gap: 4, padding: "2px 6px", background: "var(--primary-soft)", color: "var(--primary-text)", borderRadius: "var(--radius-md)", font: "500 11px/14px var(--font-mono)", textDecoration: "none" },
        }, "→ ", linkedOrder.code)
      );
    }},
    { key: "deadline", label: "Deadline", width: "12%", render: (c) =>
      c.deadline === "—" ? e("span", { className: "s21-cell-meta" }, "—") : e("span", null, c.deadline)
    },
    { key: "value", label: "Hodnota", align: "right", numeric: true, width: "14%", render: (c) =>
      e("span", { style: { fontVariantNumeric: "tabular-nums", fontWeight: 500 } }, fmt(c.value), " Kč")
    },
    { key: "flow", label: "Komunikace", width: "16%", render: (c) =>
      e("div", { style: { display: "flex", gap: "var(--space-2)", font: "400 12px/16px var(--font-body)", color: "var(--ink-muted)" } },
        e("span", null, e(S.Icon, { name: "mail", size: 12 }), " ", c.mails),
        e("span", null, e(S.Icon, { name: "file", size: 12 }), " ", c.offers, " nabídek")
      )
    },
    { key: "actions", label: "", align: "center", width: "10%", render: () =>
      e("span", { className: "s21-row-actions", "data-no-row-click": true },
        e(S.Button, { size: "sm", iconOnly: true, icon: "mail", variant: "ghost", "aria-label": "Odeslat mail", title: "Odeslat mail" }),
        e(S.Button, { size: "sm", iconOnly: true, icon: "more", variant: "ghost", "aria-label": "Akce" })
      )
    }
  ];

  const CRUMBS = [{ label: "Obchod", href: "/obchod" }, { label: "Obchodní případy", href: "/obchod/pripady" }];

  function Page() {
    const [tab, setTab] = React.useState("open");
    const [stage, setStage] = React.useState(null);
    const [q, setQ] = React.useState("");

    const open = CASES.filter((c) => c.stage !== "won" && c.stage !== "lost");
    const closed = CASES.filter((c) => c.stage === "won" || c.stage === "lost");

    let rows = tab === "open" ? open : tab === "closed" ? closed : CASES;
    if (stage) rows = rows.filter((c) => c.stage === stage);
    if (q) rows = rows.filter((c) => (c.code + " " + c.title + " " + c.client).toLowerCase().includes(q.toLowerCase()));

    const openValue = open.reduce((s, c) => s + c.value, 0);
    const wonValue = CASES.filter((c) => c.stage === "won").reduce((s, c) => s + c.value, 0);
    const conversion = Math.round((CASES.filter((c) => c.stage === "won").length / Math.max(1, CASES.filter((c) => c.stage === "won" || c.stage === "lost").length)) * 100);

    return e(S.AppShell, {
      sidebar: e(D.DemoSidebar, { active: "/obchod/pripady" }),
      topbar: e(D.DemoTopBar, { crumbs: CRUMBS }),
    },
      e(S.PageHeader, {
        title: "Obchodní případy",
        description: "Pipeline od poptávky po podpis smlouvy",
        actions: e(S.Button, { icon: "plus" }, "Nový případ"),
        tabs: e(S.Tabs, { value: tab, onChange: setTab, items: [
          { value: "open", label: "Otevřené", count: open.length },
          { value: "closed", label: "Uzavřené", count: closed.length },
          { value: "all", label: "Všechny", count: CASES.length },
        ] })
      }),
      e(S.PageBody, null,
        e(S.KpiRow, { cols: 4 },
          e(S.StatTile, { label: "Otevřených případů", value: String(open.length) }),
          e(S.StatTile, { label: "Hodnota pipeline", value: fmt(openValue), unit: "Kč", big: true }),
          e(S.StatTile, { label: "Podepsáno YTD", value: fmt(wonValue), unit: "Kč" }),
          e(S.StatTile, { label: "Konverze", value: conversion + " %" })
        ),

        e(S.FilterBar, null,
          e(S.SearchInput, { className: "s21-grow", value: q, onChange: setQ, placeholder: "Hledat případ, klient, číslo…" }),
          e(S.Select, { placeholder: "Všichni obchodníci", options: [
            { value: "pavel", label: "Pavel Obdržálek" },
            { value: "alena", label: "Alena Dvořáková" },
            { value: "tomas", label: "Tomáš Novák" },
          ] }),
          e(S.Select, { placeholder: "Všechny typy", options: [
            { value: "insurance", label: "Pojištění" },
            { value: "energy", label: "Energie" },
          ] })
        ),

        e(S.DataTable, {
          columns: COLUMNS, rows, minWidth: 980,
          onRowClick: () => window.location.href = "./crm-klient-detail.html"
        })
      )
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(e(Page));
})();
</script>
</body>
</html>
