<!doctype html>
<html lang="cs" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>System 21 · Reporty</title>
<link rel="stylesheet" href="../tokens/tokens.css">
<link rel="stylesheet" href="../dist/system21.css">
<script>(function(){try{var b=localStorage.getItem('system21-brand');if(b&&b!=='bifactory')document.documentElement.setAttribute('data-brand',b);var t=localStorage.getItem('system21-theme');if(t==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
<script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="../dist/system21.js"></script>
<script src="./_shared.js"></script>
</head>
<body>
<div id="root"></div>
<script>
(() => {
  const S = window.S21, D = window.S21Demo, e = React.createElement;

  // Monthly data (last 12 months)
  const MONTHS = ["Pro 25", "Led 26", "Úno 26", "Bře 26", "Dub 26", "Kvě 26", "Čvn 26", "Čvc 26", "Srp 26", "Zář 26", "Říj 26", "Lis 26"];
  const REVENUE = [980, 1120, 1240, 1100, 1480, 1620, 1280, 1340, 1680, 1820, 2480, 1620];
  const CONTRACTS = [14, 18, 22, 19, 26, 32, 24, 28, 30, 34, 42, 28];
  const NEW_CLIENTS = [3, 4, 5, 4, 7, 6, 5, 6, 8, 9, 12, 7];
  const AI_DOCS = [240, 280, 320, 310, 420, 480, 380, 410, 520, 640, 847, 620];

  // Top performers
  const TOP_CLIENTS = [
    { name: "Moravia Steel a.s.", revenue: "487 500 Kč", contracts: 12, trend: [180, 220, 240, 280, 320, 410, 487] },
    { name: "Agro Slovácko s.r.o.", revenue: "312 000 Kč", contracts: 8, trend: [120, 140, 180, 210, 240, 290, 312] },
    { name: "Hradecká strojírna", revenue: "248 600 Kč", contracts: 6, trend: [80, 110, 140, 180, 210, 240, 248] },
    { name: "Novákovi", revenue: "184 000 Kč", contracts: 5, trend: [60, 80, 100, 120, 140, 170, 184] },
    { name: "Obec Staré Město", revenue: "148 000 Kč", contracts: 3, trend: [40, 60, 90, 110, 130, 140, 148] },
  ];

  const TOP_CONSULTANTS = [
    { name: "Pavel Obdržálek", revenue: "1 280 000 Kč", deals: 42, winrate: "68 %" },
    { name: "Alena Dvořáková", revenue: "840 000 Kč", deals: 28, winrate: "62 %" },
    { name: "Tomáš Novák", revenue: "360 000 Kč", deals: 14, winrate: "48 %" },
  ];

  function BarChart({ data, labels, color = "var(--primary)", height = 180 }) {
    const max = Math.max(...data);
    return e("div", { style: { display: "flex", alignItems: "flex-end", gap: "var(--space-2)", height, padding: "var(--space-2) 0" } },
      data.map((v, i) => e("div", { key: i, style: { flex: 1, display: "flex", flexDirection: "column", alignItems: "center", gap: 4 } },
        e("div", { style: { width: "100%", display: "flex", flexDirection: "column", justifyContent: "flex-end", alignItems: "center", flex: 1 } },
          e("div", {
            style: {
              width: "70%", background: color, borderRadius: "var(--radius-sm) var(--radius-sm) 0 0",
              height: ((v / max) * (height - 40)) + "px",
              transition: "height 400ms var(--motion-ease-out)",
            },
            title: labels[i] + ": " + v
          })
        ),
        e("div", { style: { font: "500 10px/14px var(--font-mono)", color: "var(--ink-muted)", letterSpacing: ".04em" } }, labels[i])
      ))
    );
  }

  const CRUMBS = [{ label: "Analýzy", href: "/analyzy" }, { label: "Reporty", href: "/reporty" }];

  function Page() {
    const [range, setRange] = React.useState("12m");
    const [tab, setTab] = React.useState("prehled");

    return e(S.AppShell, {
      sidebar: e(D.DemoSidebar, { active: "/reporty" }),
      topbar: e(D.DemoTopBar, { crumbs: CRUMBS }),
    },
      e(S.PageHeader, {
        title: "Reporty",
        description: "Trendy, výkonnost týmu, pipeline · období 12 měsíců",
        actions: e(React.Fragment, null,
          e(S.SegmentedControl, {
            value: range, onChange: setRange,
            items: [
              { value: "30d", label: "30 dnů" },
              { value: "90d", label: "90 dnů" },
              { value: "12m", label: "12 měsíců" },
              { value: "all", label: "Vše" },
            ]
          }),
          e(S.Button, { variant: "secondary", icon: "download" }, "Export PDF")
        ),
        tabs: e(S.Tabs, { value: tab, onChange: setTab, items: [
          { value: "prehled", label: "Přehled" },
          { value: "klienti", label: "Klienti" },
          { value: "tym", label: "Výkonnost týmu" },
          { value: "ai", label: "AI efektivita" },
        ] })
      }),
      e(S.PageBody, null,
        // Primary KPIs with trend
        e(S.KpiRow, { cols: 4 },
          e(S.StatTile, { label: "Tržby YTD", value: "17,48", unit: "mil. Kč", big: true, accent: "primary" }),
          e(S.StatTile, { label: "Smlouvy", value: "317", hint: "+28 vs. minulý měsíc" }),
          e(S.StatTile, { label: "Noví klienti", value: "76", accent: "success" }),
          e(S.StatTile, { label: "Konverze pipeline", value: "63 %", accent: "success", hint: "+5 pp" })
        ),

        // Revenue bar chart
        e(S.Section, { title: "Tržby po měsících", subtitle: "Prosinec 2025 – Listopad 2026" },
          e(BarChart, { data: REVENUE, labels: MONTHS, height: 220 }),
          e("div", { style: { display: "flex", gap: "var(--space-4)", font: "400 12px/16px var(--font-body)", color: "var(--ink-muted)", marginTop: "var(--space-2)" } },
            e("span", null, "Celkem: ", e("strong", { style: { color: "var(--ink)" } }, "17 480 tis. Kč")),
            e("span", null, "Průměr/měs.: ", e("strong", { style: { color: "var(--ink)" } }, "1 457 tis. Kč")),
            e("span", null, "Peak: ", e("strong", { style: { color: "var(--primary-text)" } }, "Říj 26 · 2 480 tis. Kč"))
          )
        ),

        // Two columns: contracts + AI docs
        e("div", { style: { display: "grid", gridTemplateColumns: "1fr 1fr", gap: "var(--space-4)" } },
          e(S.Section, { title: "Nové smlouvy po měsících" },
            e(BarChart, { data: CONTRACTS, labels: MONTHS, color: "var(--primary)", height: 160 })
          ),
          e(S.Section, { title: "AI zpracované dokumenty" },
            e(BarChart, { data: AI_DOCS, labels: MONTHS, color: "var(--ai-c-mid)", height: 160 })
          )
        ),

        // Top clients
        e(S.Section, { title: "Top 5 klientů podle tržeb (YTD)" },
          e("ul", { style: { listStyle: "none", margin: 0, padding: 0, display: "flex", flexDirection: "column", gap: "var(--space-2)" } },
            TOP_CLIENTS.map((c, i) => e("li", { key: c.name,
              style: {
                display: "grid", gridTemplateColumns: "28px 1fr 160px 120px 100px",
                alignItems: "center", gap: "var(--space-3)",
                padding: "var(--space-2) var(--space-3)",
                background: "var(--surface-raised)", border: "1px solid var(--border-subtle)",
                borderRadius: "var(--radius-lg)"
              }
            },
              e("span", { style: { font: "700 14px var(--font-display)", color: "var(--ink-muted)" } }, "#" + (i + 1)),
              e("div", null,
                e("div", { style: { font: "600 14px/20px var(--font-body)" } }, c.name),
                e("div", { style: { font: "400 12px/16px var(--font-body)", color: "var(--ink-muted)" } }, c.contracts + " smluv")
              ),
              e(S.Sparkline, { data: c.trend, width: 160, height: 32, stroke: "var(--primary)", fill: "var(--primary-soft)" }),
              e("span", { style: { textAlign: "right", font: "600 14px/20px var(--font-body)", fontVariantNumeric: "tabular-nums" } }, c.revenue),
              e(S.Tag, { tone: "success" }, "+14 %")
            ))
          )
        ),

        // Top consultants
        e(S.Section, { title: "Výkonnost konzultantů" },
          e("div", { style: { display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(280px, 1fr))", gap: "var(--space-3)" } },
            TOP_CONSULTANTS.map((p) => e(S.EntityCard, {
              key: p.name,
              icon: "user",
              title: p.name,
              subtitle: p.deals + " uzavřených obchodů · winrate " + p.winrate,
              meta: [
                { label: "Tržby YTD", value: p.revenue },
                { label: "Win rate", value: p.winrate },
              ],
              accent: "primary",
              onClick: () => {}
            }))
          )
        ),

        // Timeline of milestones
        e(S.Section, { title: "Milníky kvartálu" },
          e(S.Timeline, { items: [
            { time: "01. 09. 2026", title: "Nasazení System 21 u klienta Moravia Steel", description: "První enterprise instalace.", icon: "check", tone: "success" },
            { time: "15. 09. 2026", title: "AI asistentka — zpracování smluv v produkci", description: "Rozpoznání typu + extrakce údajů, 94% úspěšnost.", icon: "sparkles", tone: "primary" },
            { time: "08. 10. 2026", title: "Nový pojistitel — ČPP", description: "Napojení na partnerský portál.", icon: "building", tone: "primary" },
            { time: "20. 10. 2026", title: "Překročena hranice 1 500 smluv v systému", description: "Oproti začátku roku +520 smluv (+53 %).", icon: "trending-up", tone: "success" },
            { time: "01. 11. 2026", title: "Rozšíření týmu o Janu Svobodovou", description: "Office manager — nástup 17. 11.", icon: "user-plus" },
          ] })
        )
      )
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(e(Page));
})();
</script>
</body>
</html>
