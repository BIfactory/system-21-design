<!doctype html>
<html lang="cs" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>System 21 · Zakázky</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../tokens/tokens.css">
<link rel="stylesheet" href="../dist/system21.css">
<script>(function(){try{var b=localStorage.getItem('system21-brand');if(b&&b!=='bifactory')document.documentElement.setAttribute('data-brand',b);var t=localStorage.getItem('system21-theme');if(t==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
<script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="../dist/system21.js"></script>
<script src="./_shared.js"></script>
<script src="./_shared-data.js"></script>
<style>
  .pct { font-variant-numeric: tabular-nums; font-weight: 600; }
  .pct.low { color: var(--success-text); }
  .pct.mid { color: var(--warning-text); }
  .pct.over { color: var(--danger-text); }
  .dl-badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: var(--radius-full); font: 500 11px/16px var(--font-mono); letter-spacing: .04em; white-space: nowrap; }
  .dl-badge.ok { background: var(--surface-muted); color: var(--ink-muted); }
  .dl-badge.soon { background: var(--warning-bg); color: var(--warning-text); }
  .dl-badge.over { background: var(--danger-bg); color: var(--danger-text); }
  .flag { display: inline-flex; align-items: center; gap: 4px; padding: 2px 6px; border-radius: var(--radius-sm); font: 500 10px/14px var(--font-mono); letter-spacing: .04em; text-transform: uppercase; }
  .flag.docs { background: var(--warning-bg); color: var(--warning-text); }
  .flag.no-raynet { background: var(--surface-muted); color: var(--ink-muted); }
  .flag.late { background: var(--danger-bg); color: var(--danger-text); }
  .margin-pos { color: var(--success-text); font-weight: 600; }
  .margin-neg { color: var(--danger-text); font-weight: 600; }
  .mobile-kpi { display: flex; gap: var(--space-3); font: 500 12px/16px var(--font-body); color: var(--ink-muted); }
  .mobile-kpi strong { color: var(--ink); font-weight: 600; }
</style>
</head>
<body>
<div id="root"></div>
<script>
(() => {
  const S = window.S21, D = window.S21Demo, e = React.createElement;

  // ─── data from S21Data (single source of truth) ───────────────────
  // internal_status: new | quoted | ready | in_progress | done | delivered | cancelled
  const ORDERS = window.S21Data.ORDERS;


  const fmt = (n) => n == null ? "—" : n.toLocaleString("cs-CZ").replace(/,/g, " ");
  const pctCls = (p) => p > 100 ? "over" : p >= 95 ? "mid" : p >= 80 ? "mid" : "low";

  function daysTo(dl) {
    if (!dl || dl === "—") return null;
    const [d, m, y] = dl.split(".").map((s) => parseInt(s.trim(), 10));
    return Math.round((new Date(y, m - 1, d) - new Date()) / (1000 * 60 * 60 * 24));
  }
  function DeadlineBadge({ dl, overdue }) {
    const days = daysTo(dl);
    if (days === null) return e("span", { className: "s21-cell-meta" }, "—");
    if (days < 0 || overdue) return e("span", { className: "dl-badge over" }, "⚠ Po termínu");
    if (days <= 7) return e("span", { className: "dl-badge soon" }, "za " + days + " dnů");
    if (days <= 30) return e("span", { className: "dl-badge soon" }, dl);
    return e("span", { className: "dl-badge ok" }, dl);
  }

  const TYPE_ICON = { "AI": "sparkles", "Vývoj": "sparkles", "Integrace": "refresh", "Konzultace": "chat", "Školení": "notes" };

  // ─── columns — bohaté, polepim-like ────────────────────────────────
  const COLUMNS = [
    { key: "code", label: "Číslo", width: "10%", render: (o) =>
      e("div", { style: { display: "flex", flexDirection: "column", gap: 2 } },
        e("span", { className: "s21-cell-code" }, o.code),
        o.raynet && e("span", { className: "flag no-raynet", title: "ID v Raynetu" }, o.raynet)
      )
    },
    { key: "name", label: "Zakázka", sortable: true, width: "26%", render: (o) =>
      e("div", null,
        e("div", { style: { display: "flex", alignItems: "center", gap: 6, flexWrap: "wrap" } },
          e(S.Icon, { name: TYPE_ICON[o.type] || "folder", size: 14, className: "", title: o.type }),
          e("span", { className: "s21-cell-title" }, o.name),
          o.missingDocs && e("span", { className: "flag docs", title: "Chybějící podklady" }, "⚠ podklady"),
          o.overdue && e("span", { className: "flag late" }, "⚠ po termínu")
        ),
        e("div", { className: "s21-cell-meta" }, o.client, " · ", o.type, " · vznik ", o.created)
      )
    },
    { key: "status", label: "Stav", width: "11%", render: (o) =>
      e(S.Badge, { tone: o.stateTone, fitCell: true }, o.stateLabel)
    },
    { key: "deadline", label: "Deadline", width: "12%", render: (o) =>
      e(DeadlineBadge, { dl: o.deadline, overdue: o.overdue })
    },
    { key: "progress", label: "Plnění", align: "right", numeric: true, width: "9%", render: (o) =>
      o.progress > 0
        ? e("span", { className: "pct " + pctCls(o.progress) }, o.progress + " %")
        : e("span", { className: "s21-cell-meta" }, "—")
    },
    { key: "price", label: "Cena", align: "right", numeric: true, width: "13%", render: (o) =>
      e("div", { style: { display: "flex", flexDirection: "column", gap: 2, fontVariantNumeric: "tabular-nums" } },
        e("span", { style: { fontWeight: 500 } }, fmt(o.priceOffer), o.priceOffer ? " Kč" : ""),
        o.priceReal != null && o.priceReal !== o.priceOffer && e("span", { className: "s21-cell-meta" }, "reál ", fmt(o.priceReal), " Kč")
      )
    },
    { key: "margin", label: "Marže", align: "right", numeric: true, width: "8%", render: (o) =>
      o.margin == null
        ? e("span", { className: "s21-cell-meta" }, "—")
        : e("span", { className: o.marginPos ? "margin-pos" : "margin-neg" }, (o.margin > 0 ? "+" : "") + o.margin + " %")
    },
    { key: "actions", label: "", align: "center", width: "11%", render: (o) =>
      e("span", { className: "s21-row-actions", "data-no-row-click": true },
        e(S.Button, { size: "sm", iconOnly: true, icon: "clock", variant: "ghost", "aria-label": "Vykázat hodiny", title: "Vykázat hodiny", onClick: (ev) => { ev.stopPropagation(); window.location.href = "./vykazovani.html"; } }),
        o.status !== "done" && o.status !== "delivered" && o.status !== "cancelled" &&
          e(S.Button, { size: "sm", iconOnly: true, icon: "check", variant: "ghost", "aria-label": "Označit hotové", title: "Označit hotové" }),
        e(S.DropdownMenu, {
          trigger: e(S.Button, { size: "sm", iconOnly: true, icon: "more", variant: "ghost", "aria-label": "Více akcí", title: "Více akcí" })
        }, ({ close }) => e(React.Fragment, null,
          e("button", { type: "button", role: "menuitem", className: "s21-dd__item s21-dd__item--btn", onClick: () => { close(); window.location.href = "./zakazka-detail.html"; } },
            e("span", { className: "s21-dd__itemmain" }, e(S.Icon, { name: "eye", size: 14 }), "Otevřít detail")
          ),
          e("button", { type: "button", role: "menuitem", className: "s21-dd__item s21-dd__item--btn", onClick: () => close() },
            e("span", { className: "s21-dd__itemmain" }, e(S.Icon, { name: "copy", size: 14 }), "Duplikovat")
          ),
          e("button", { type: "button", role: "menuitem", className: "s21-dd__item s21-dd__item--btn", onClick: () => close() },
            e("span", { className: "s21-dd__itemmain" }, e(S.Icon, { name: "file", size: 14 }), "PDF průvodka")
          ),
          e("button", { type: "button", role: "menuitem", className: "s21-dd__item s21-dd__item--btn", onClick: () => close() },
            e("span", { className: "s21-dd__itemmain" }, e(S.Icon, { name: "send", size: 14 }), "Odeslat nabídku")
          )
        ))
      )
    }
  ];

  function OrderCard({ o }) {
    return e("article", {
      style: { padding: "var(--space-3)", background: "var(--surface-raised)", border: "1px solid var(--border)", borderRadius: "var(--radius-xl)", display: "flex", flexDirection: "column", gap: "var(--space-2)", cursor: "pointer" },
      onClick: () => window.location.href = "./zakazka-detail.html"
    },
      e("div", { style: { display: "flex", alignItems: "baseline", gap: "var(--space-2)" } },
        e("span", { style: { flex: 1, font: "600 15px/20px var(--font-body)" } }, o.name),
        e(S.Badge, { tone: o.stateTone, fitCell: true }, o.stateLabel)
      ),
      e("div", { style: { display: "flex", alignItems: "center", gap: 6, flexWrap: "wrap", font: "400 12px/16px var(--font-body)", color: "var(--ink-muted)" } },
        e("span", { className: "s21-cell-code" }, o.code),
        e("span", null, "·"), e("span", null, o.client),
        o.raynet && e("span", { className: "flag no-raynet" }, o.raynet),
        o.missingDocs && e("span", { className: "flag docs" }, "⚠ podklady")
      ),
      e("div", { className: "mobile-kpi" },
        e("span", null, "Vznik: ", e("strong", null, o.created)),
        e("span", null, "Plnění: ", e("strong", { className: "pct " + pctCls(o.progress) }, o.progress + " %")),
        e("span", null, "Cena: ", e("strong", null, fmt(o.priceOffer), o.priceOffer ? " Kč" : ""))
      ),
      e(DeadlineBadge, { dl: o.deadline, overdue: o.overdue })
    );
  }

  const CRUMBS = [{ label: "Zakázky", href: "/zakazky" }];

  function Page() {
    const [tab, setTab] = React.useState("aktivni");
    const [chip, setChip] = React.useState("all");
    const [q, setQ] = React.useState("");

    const activeOrders = ORDERS.filter((o) => o.status !== "delivered" && o.status !== "cancelled");
    const invoiceReady = ORDERS.filter((o) => o.status === "done");

    let rows = tab === "aktivni" ? activeOrders : tab === "fakturaci" ? invoiceReady : ORDERS;

    // "Co pálí" — new chip filters
    const overdueCount = ORDERS.filter(o => o.overdue).length;
    const overhoursCount = ORDERS.filter(o => o.plannedHours && o.realHours > o.plannedHours * 1.1).length;
    const lowmarginCount = ORDERS.filter(o => o.margin != null && o.margin < 15).length;
    const nologIds = [2, 7]; // mock IDs for "no log > 7 days"
    const nologCount = ORDERS.filter(o => nologIds.includes(o.id)).length;

    if (chip === "overdue") rows = rows.filter((o) => o.overdue);
    else if (chip === "overhours") rows = rows.filter((o) => o.plannedHours && o.realHours > o.plannedHours * 1.1);
    else if (chip === "lowmargin") rows = rows.filter((o) => o.margin != null && o.margin < 15);
    else if (chip === "nolog") rows = rows.filter((o) => nologIds.includes(o.id));

    if (q) rows = rows.filter((o) => (o.name + " " + o.client + " " + o.code + " " + (o.raynet || "")).toLowerCase().includes(q.toLowerCase()));

    const totalValue = activeOrders.reduce((sum, o) => sum + (o.priceOffer || 0), 0);

    return e(S.AppShell, {
      sidebar: e(D.DemoSidebar, { active: "/zakazky" }),
      topbar: e(D.DemoTopBar, { crumbs: CRUMBS }),
    },
      e(S.PageHeader, {
        title: "Zakázky",
        description: "Přehled všech zakázek a jejich stavu",
        actions: e(React.Fragment, null,
          e(S.Button, { variant: "secondary", icon: "refresh" }, "Sync Raynet"),
          e(S.Button, { icon: "plus", onClick: () => window.location.href = "./zakazka-nova.html" }, "Nová zakázka")
        ),
        tabs: e(S.Tabs, { value: tab, onChange: setTab, items: [
          { value: "aktivni", label: "Aktivní", count: activeOrders.length },
          { value: "fakturaci", label: "K fakturaci", count: invoiceReady.length },
          { value: "vsechny", label: "Všechny", count: ORDERS.length },
        ] })
      }),
      e(S.PageBody, null,
        e(S.KpiRow, { cols: 4 },
          e(S.StatTile, { label: "Aktivních", value: String(activeOrders.length) }),
          e(S.StatTile, { label: "V běhu", value: String(ORDERS.filter(o => o.status === "in_progress").length) }),
          e(S.StatTile, { label: "Po termínu", value: String(overdueCount), accent: overdueCount > 0 ? "danger" : undefined }),
          e(S.StatTile, { label: "Hodnota aktivních", value: fmt(totalValue), unit: "Kč", big: true })
        ),

        e(S.ChipGroup, { value: chip, onChange: setChip, items: [
          { value: "all", label: "Vše" },
          { value: "overdue", label: "Po termínu", count: overdueCount },
          { value: "overhours", label: "Přetažené hodinami", count: overhoursCount },
          { value: "lowmargin", label: "Nízká marže", count: lowmarginCount },
          { value: "nolog", label: "Bez výkazu > 7 dní", count: nologCount },
        ] }),

        e(S.FilterBar, null,
          e(S.SearchInput, { className: "s21-grow", value: q, onChange: setQ, placeholder: "Hledat název, klient, číslo, Raynet…" }),
          e(S.Select, { placeholder: "Všichni klienti", options: [
            { value: "moravia", label: "Moravia Steel" }, { value: "agro", label: "Agro Slovácko" },
            { value: "hradecka", label: "Hradecká strojírna" }, { value: "prochazkovi", label: "Procházkovi" },
          ] }),
          e(S.Select, { placeholder: "Všechny typy", options: [
            { value: "vyvoj", label: "Vývoj" }, { value: "integ", label: "Integrace" },
            { value: "konz", label: "Konzultace" }, { value: "ai", label: "AI" }, { value: "skol", label: "Školení" },
          ] })
        ),

        e(S.DataTable, {
          columns: COLUMNS, rows, minWidth: 960,
          onRowClick: () => window.location.href = "./zakazka-detail.html",
          renderCard: (o) => e(OrderCard, { o, key: o.id })
        })
      )
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(e(Page));
})();
</script>
</body>
</html>
