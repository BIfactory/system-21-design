<!doctype html>
<html lang="cs" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>System 21 · Kapacita</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../tokens/tokens.css">
<link rel="stylesheet" href="../dist/system21.css">
<script>(function(){try{var b=localStorage.getItem('system21-brand');if(b&&b!=='bifactory')document.documentElement.setAttribute('data-brand',b);var t=localStorage.getItem('system21-theme');if(t==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
<script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="../dist/system21.js"></script>
<script src="./_shared.js"></script>
<script src="./_shared-data.js"></script>
<style>
  /* ── Toolbar ───────────────────────────────────────────── */
  .cap-toolbar { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); padding: var(--space-3) 0; }
  .cap-toolbar__label { font: 600 14px/20px var(--font-body); color: var(--ink); }

  /* ── Kapacitní tabulka ─────────────────────────────────── */
  .cap-table-wrap { overflow-x: auto; background: var(--surface-raised); border: 1px solid var(--border); border-radius: var(--radius-xl); padding: var(--space-2); }
  .cap-table { width: 100%; border-collapse: separate; border-spacing: 2px; min-width: 720px; }
  .cap-table th { padding: 8px 12px; font: 500 11px/16px var(--font-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-muted); text-align: left; }
  .cap-table__name { width: 160px; }
  .cap-table td { padding: 0; }
  .cap-cell { padding: 10px 12px; border-radius: var(--radius-md); cursor: pointer; display: flex; flex-direction: column; gap: 2px; min-height: 56px; }
  .cap-cell:hover { outline: 2px solid var(--primary); }
  .cap-cell--empty { background: var(--surface-muted); color: var(--ink-subtle); }
  .cap-cell--low { background: var(--warning-bg); color: var(--warning-text); }
  .cap-cell--ok { background: var(--success-bg); color: var(--success-text); }
  .cap-cell--over { background: var(--danger-bg); color: var(--danger-text); }
  .cap-cell__hours { font: 600 14px/18px var(--font-body); font-variant-numeric: tabular-nums; }
  .cap-cell__ops { font: 400 11px/14px var(--font-mono); opacity: 0.8; }

  /* ── Drawer body ───────────────────────────────────────── */
  .cap-drawer__body { display: flex; flex-direction: column; gap: var(--space-4); }
  .cap-drawer__stats { display: flex; flex-direction: column; gap: var(--space-1); padding: var(--space-3); background: var(--surface-muted); border-radius: var(--radius-md); font: 400 13px/20px var(--font-body); color: var(--ink-muted); }
  .cap-drawer__stats strong { color: var(--ink); }
  .cap-drawer__item { display: flex; flex-direction: column; gap: 2px; padding: var(--space-2) 0; border-bottom: 1px solid var(--border); }
  .cap-drawer__item:last-child { border-bottom: none; }
</style>
</head>
<body>
<div id="root"></div>
<script>
(() => {
  const S = window.S21, D = window.S21Demo, SD = window.S21Data, e = React.createElement;

  // ── Helper: "2026-11-09" → "Po 9. 11." ──────────────────
  const DAY_NAMES = ["Ne", "Po", "Út", "St", "Čt", "Pá", "So"];
  function formatDayLabel(iso) {
    const [y, m, d] = iso.split("-").map(Number);
    const dt = new Date(y, m - 1, d);
    return DAY_NAMES[dt.getDay()] + " " + d + ". " + m + ".";
  }

  // ── Helper: get order name from ORDERS by id ─────────────
  function orderCode(orderId) {
    const o = SD.ORDERS.find(o => o.id === orderId);
    return o ? o.code : "—";
  }

  // ── Helper: get operation name from order ────────────────
  function operationName(orderId, opCode) {
    const o = SD.ORDERS.find(o => o.id === orderId);
    if (!o || !o.operations) return opCode;
    const op = o.operations.find(op => op.code === opCode);
    return op ? op.name : opCode;
  }

  // ── Helper: remaining hours for a single operation ───────
  function remainingHours(orderId, opCode) {
    const o = SD.ORDERS.find(o => o.id === orderId);
    if (!o || !o.operations) return 0;
    const op = o.operations.find(op => op.code === opCode);
    if (!op) return 0;
    const assigned = SD.CAPACITY
      .filter(c => c.orderId === orderId && c.operationCode === opCode)
      .reduce((s, c) => s + c.hours, 0);
    return Math.max(0, (op.planned || 0) - assigned);
  }

  // ── AddOperationForm ─────────────────────────────────────
  function AddOperationForm({ workerId, date, onAdd }) {
    const [orderId, setOrderId] = React.useState("");
    const [opCode, setOpCode] = React.useState("");
    const [hours, setHours] = React.useState("");

    const orderOptions = SD.getActiveOrders().map(o => ({
      value: String(o.id),
      label: o.code + " " + o.name,
    }));

    const selectedOrder = orderId ? SD.ORDERS.find(o => o.id === parseInt(orderId)) : null;
    const opOptions = (selectedOrder && selectedOrder.operations ? selectedOrder.operations : [])
      .map(op => ({
        value: op.code,
        label: op.code + " " + op.name + " (zbývá " + remainingHours(parseInt(orderId), op.code) + " h)",
      }));

    return e("div", { style: { display: "flex", flexDirection: "column", gap: "var(--space-2)" } },
      e(S.Field, { label: "Zakázka" },
        e(S.SearchSelect, {
          value: orderId,
          onChange: v => { setOrderId(v); setOpCode(""); },
          options: orderOptions,
          placeholder: "Vyberte zakázku…",
        })
      ),
      e(S.Field, { label: "Operace" },
        e(S.SearchSelect, {
          value: opCode,
          onChange: setOpCode,
          options: opOptions,
          placeholder: "Vyberte operaci…",
          disabled: !orderId,
        })
      ),
      e(S.Field, { label: "Hodiny" },
        e("input", {
          className: "s21-input",
          type: "number",
          min: "0.5",
          step: "0.5",
          value: hours,
          onChange: ev => setHours(ev.target.value),
          placeholder: "např. 2",
        })
      ),
      e(S.Button, {
        disabled: !orderId || !opCode || !hours,
        onClick: () => { onAdd(); alert("Demo: operace by se přidala do plánu"); },
      }, "Přidat")
    );
  }

  // ── Breadcrumbs ──────────────────────────────────────────
  const CRUMBS = [
    { label: "Výroba", href: "/vyroba" },
    { label: "Kapacita", href: "/vyroba/kapacita" },
  ];

  function Page() {
    const [drawerCell, setDrawerCell] = React.useState(null); // { workerId, date } | null

    // Compute total hours for open drawer cell
    function totalHoursForDrawer() {
      if (!drawerCell) return 0;
      return SD.getCapacityForWeek(drawerCell.workerId, drawerCell.date)
        .reduce((s, c) => s + c.hours, 0);
    }

    // Drawer title: "Pavel Obdržálek · Út 10. 11."
    function drawerTitle() {
      if (!drawerCell) return "";
      const worker = SD.WORKERS.find(w => w.id === drawerCell.workerId);
      return (worker ? worker.name : "—") + " · " + formatDayLabel(drawerCell.date);
    }

    // Build assigned operations list for drawer
    function drawerOperations() {
      if (!drawerCell) return [];
      return SD.getCapacityForWeek(drawerCell.workerId, drawerCell.date);
    }

    return e(S.AppShell, {
      sidebar: e(D.DemoSidebar, { active: "/vyroba/kapacita" }),
      topbar: e(D.DemoTopBar, { crumbs: CRUMBS }),
    },
      e(S.PageHeader, {
        title: "Kapacita",
        description: "Kdo kdy dělá co · jak jsou vytížené kapacity",
      }),

      e(S.PageBody, null,

        // ── Week navigation toolbar ──────────────────────
        e("div", { className: "cap-toolbar" },
          e(S.Button, { variant: "secondary", size: "sm", icon: "chevron-left", disabled: true }, "Předchozí týden"),
          e("div", { className: "cap-toolbar__label" }, "Pondělí 9. 11. — Pátek 13. 11. 2026"),
          e(S.Button, { variant: "secondary", size: "sm", icon: "chevron-right", disabled: true }, "Další týden")
        ),

        // ── 7×5 capacity table ───────────────────────────
        e("div", { className: "cap-table-wrap" },
          e("table", { className: "cap-table" },
            e("thead", null,
              e("tr", null,
                e("th", { className: "cap-table__name" }, "Pracovník"),
                ...SD.WORKING_DAYS.map(d => e("th", { key: d }, formatDayLabel(d)))
              )
            ),
            e("tbody", null,
              SD.WORKERS.map(w => e("tr", { key: w.id },
                e("td", { className: "cap-table__name" },
                  e("div", { className: "cap-cell", style: { cursor: "default", background: "transparent", minHeight: "auto", padding: "10px 12px" } },
                    e("div", { className: "cap-cell__hours" }, w.name),
                    e("div", { className: "cap-cell__ops" }, w.position)
                  )
                ),
                ...SD.WORKING_DAYS.map(d => {
                  const u = SD.getUtilization(w.id, d);
                  const assigned = SD.getCapacityForWeek(w.id, d);
                  const tone = u === 0 ? "empty" : u < 60 ? "low" : u <= 110 ? "ok" : "over";
                  const hours = assigned.reduce((s, c) => s + c.hours, 0);
                  return e("td", { key: d },
                    e("div", {
                      className: "cap-cell cap-cell--" + tone,
                      title: hours + " h · " + u + " %",
                      onClick: () => setDrawerCell({ workerId: w.id, date: d }),
                    },
                      e("div", { className: "cap-cell__hours" }, hours ? hours + " h" : "—"),
                      assigned.length > 0 && e("div", { className: "cap-cell__ops" }, assigned.map(a => a.operationCode).join(" · "))
                    )
                  );
                })
              ))
            )
          )
        )
      ),

      // ── Side drawer ──────────────────────────────────────
      drawerCell && e(S.Drawer, {
        open: true,
        onClose: () => setDrawerCell(null),
        title: drawerTitle(),
        side: "right",
        size: 420,
      },
        e("div", { className: "cap-drawer__body" },

          // Stats block
          e("div", { className: "cap-drawer__stats" },
            e("div", null, "Rozplánováno: ", e("strong", null, totalHoursForDrawer() + " h / 8 h")),
            e("div", null, "Utilizace: ", e("strong", null, SD.getUtilization(drawerCell.workerId, drawerCell.date) + " %"))
          ),

          // Assigned operations
          e(S.Section, { title: "Přiřazené operace" },
            drawerOperations().length === 0
              ? e("div", { style: { color: "var(--ink-muted)", fontSize: "13px", padding: "var(--space-2) 0" } }, "Žádné operace v tento den.")
              : e("div", null,
                  ...drawerOperations().map((c, i) =>
                    e("div", { key: i, className: "cap-drawer__item" },
                      e("div", null,
                        e("strong", null, c.operationCode),
                        " · ",
                        operationName(c.orderId, c.operationCode)
                      ),
                      e("div", { className: "s21-cell-meta" },
                        orderCode(c.orderId) + " · " + c.hours + " h"
                      )
                    )
                  )
                )
          ),

          // Add operation form
          e(S.Section, { title: "Přidat operaci" },
            e(AddOperationForm, {
              workerId: drawerCell.workerId,
              date: drawerCell.date,
              onAdd: () => {},
            })
          )
        )
      )
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(e(Page));
})();
</script>
</body>
</html>
