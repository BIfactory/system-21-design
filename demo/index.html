<!doctype html>
<html lang="cs" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>System 21 · Zakázky</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../tokens/tokens.css">
<link rel="stylesheet" href="../dist/system21.css">
<script>(function(){try{var b=localStorage.getItem('system21-brand');if(b&&b!=='bifactory')document.documentElement.setAttribute('data-brand',b);var t=localStorage.getItem('system21-theme');if(t==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
<script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="../dist/system21.js"></script>
<script src="./_shared.js"></script>
</head>
<body>
<div id="root"></div>
<script>
(() => {
  const S = window.S21, D = window.S21Demo, e = React.createElement;

  const ORDERS = [
    { id: 1, code: "ZAK-2026-0142", name: "Reporting obchodu — pilot", client: "Moravia Steel a.s.", state: "win", created: "12. 05. 2026", price: "184 000 Kč", margin: "+32 %", progress: "68 %" },
    { id: 2, code: "ZAK-2026-0139", name: "Automatizace výkazů práce", client: "Hradecká strojírna s.r.o.", state: "offer", created: "03. 05. 2026", price: "96 500 Kč", margin: "+24 %", progress: "—" },
    { id: 3, code: "ZAK-2026-0131", name: "Napojení ERP → CRM", client: "Agro Slovácko", state: "overdue", created: "22. 04. 2026", price: "312 000 Kč", margin: "−4 %", progress: "41 %" },
    { id: 4, code: "ZAK-2026-0127", name: "AI asistent pro zápisy z porad", client: "Obec Staré Město", state: "done", created: "15. 04. 2026", price: "48 000 Kč", margin: "+41 %", progress: "100 %" },
    { id: 5, code: "ZAK-2026-0126", name: "Audit CRM dat", client: "Moravia Steel a.s.", state: "done", created: "10. 04. 2026", price: "27 500 Kč", margin: "+28 %", progress: "100 %" },
    { id: 6, code: "ZAK-2026-0122", name: "Školení týmu v Notion", client: "Hradecká strojírna", state: "done", created: "02. 04. 2026", price: "16 000 Kč", margin: "+52 %", progress: "100 %" },
    { id: 7, code: "ZAK-2026-0118", name: "Import historie z Raynet", client: "Agro Slovácko", state: "in-progress", created: "28. 03. 2026", price: "36 000 Kč", margin: "+12 %", progress: "80 %" },
  ];

  const COLUMNS = [
    { key: "code", label: "Číslo", sortable: true, width: "14%", render: (o) => e("span", { className: "s21-cell-code" }, o.code) },
    { key: "name", label: "Zakázka", sortable: true, width: "32%", render: (o) =>
      e("div", null,
        e("div", { className: "s21-cell-title" }, o.name),
        e("div", { className: "s21-cell-meta" }, o.client)
      )
    },
    { key: "created", label: "Vznik", align: "right", numeric: true, width: "12%" },
    { key: "price", label: "Cena", align: "right", numeric: true, width: "14%" },
    { key: "margin", label: "Marže", align: "right", numeric: true, width: "10%" },
    { key: "state", label: "Stav", width: "14%", render: (o) => e(S.WorkflowBadge, { state: o.state, fitCell: true }) },
    { key: "actions", label: "", align: "center", width: "4%", render: () =>
      e(S.Button, { size: "sm", iconOnly: true, icon: "more", variant: "ghost", "aria-label": "Víc", title: "Akce" })
    }
  ];

  const CRUMBS = [{ label: "Zakázky", href: "/zakazky" }];

  function Page() {
    const [chip, setChip] = React.useState("all");
    const [q, setQ] = React.useState("");

    const FILTERS = {
      all: ORDERS,
      open: ORDERS.filter((o) => o.state !== "done" && o.state !== "loss"),
      done: ORDERS.filter((o) => o.state === "done"),
    };
    const rows = (FILTERS[chip] || ORDERS).filter((o) =>
      !q || (o.name + " " + o.client + " " + o.code).toLowerCase().includes(q.toLowerCase())
    );

    return e(S.AppShell, {
      sidebar: e(D.DemoSidebar, { active: "/zakazky" }),
      topbar: e(D.DemoTopBar, { crumbs: CRUMBS }),
    },
      e(S.PageHeader, {
        title: "Zakázky",
        description: "Všechny obchodní zakázky napříč klienty",
        actions: e(S.Button, { icon: "plus", onClick: () => window.location.href = "./predavaci-protokol.html" }, "Nová zakázka")
      }),
      e(S.PageBody, null,
        e(S.KpiRow, { cols: 4 },
          e(S.StatTile, { label: "Celkem", value: String(ORDERS.length), hint: "všech stavů" }),
          e(S.StatTile, { label: "Otevřené", value: String(FILTERS.open.length), accent: "primary" }),
          e(S.StatTile, { label: "Po termínu", value: String(ORDERS.filter(o => o.state === "overdue").length), accent: "danger" }),
          e(S.StatTile, { label: "Hotové", value: String(FILTERS.done.length) })
        ),
        e(S.ChipGroup, { value: chip, onChange: setChip, items: [
          { value: "all", label: "Všechny", count: FILTERS.all.length },
          { value: "open", label: "Otevřené", count: FILTERS.open.length },
          { value: "done", label: "Hotové", count: FILTERS.done.length },
        ] }),
        e(S.FilterBar, null,
          e(S.SearchInput, { className: "s21-grow", value: q, onChange: setQ, placeholder: "Hledat název, klient, číslo…" }),
          e(S.Select, { placeholder: "Všichni klienti", options: [
            { value: "moravia", label: "Moravia Steel" },
            { value: "hradecka", label: "Hradecká strojírna" },
            { value: "agro", label: "Agro Slovácko" }
          ] })
        ),
        e(S.DataTable, {
          columns: COLUMNS, rows, minWidth: 820,
          onRowClick: () => window.location.href = "./zakazka-detail.html"
        })
      )
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(e(Page));
})();
</script>
</body>
</html>
