<!doctype html>
<html lang="cs" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>System 21 · DMS Smlouvy</title>
<link rel="stylesheet" href="../tokens/tokens.css">
<link rel="stylesheet" href="../dist/system21.css">
<script>(function(){try{var b=localStorage.getItem('system21-brand');if(b&&b!=='bifactory')document.documentElement.setAttribute('data-brand',b);var t=localStorage.getItem('system21-theme');if(t==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
<script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="../dist/system21.js"></script>
<script src="./_shared.js"></script>
</head>
<body>
<div id="root"></div>
<script>
(() => {
  const S = window.S21, D = window.S21Demo, e = React.createElement;

  const CONTRACTS = [
    { id: 1, code: "SM-2026-0117", name: "Pojištění majetku", client: "Novákovi", validFrom: "12. 04. 2024", validTo: "12. 04. 2027", state: "in-progress", premium: "14 400 Kč" },
    { id: 2, code: "SM-2026-0123", name: "Úrazové pojištění rodinné", client: "Novákovi", validFrom: "03. 03. 2025", validTo: "03. 03. 2028", state: "in-progress", premium: "7 200 Kč" },
    { id: 3, code: "SM-2026-0130", name: "Autopojištění Octavia", client: "Dvořákovi", validFrom: "10. 10. 2026", validTo: "10. 10. 2027", state: "in-progress", premium: "18 600 Kč" },
    { id: 4, code: "SM-2026-0142", name: "Povinné ručení", client: "Agro Slovácko", validFrom: "01. 11. 2026", validTo: "01. 11. 2027", state: "offer", premium: "32 400 Kč" },
    { id: 5, code: "SM-2026-0145", name: "Firemní pojištění", client: "Moravia Steel", validFrom: "—", validTo: "—", state: "negotiation", premium: "124 000 Kč" },
    { id: 6, code: "SM-2026-0151", name: "Živnostenské pojištění", client: "Procházkovi", validFrom: "—", validTo: "—", state: "draft", premium: "— Kč" },
    { id: 7, code: "SM-2025-0098", name: "Pojištění budovy", client: "Hradecká str.", validFrom: "15. 01. 2024", validTo: "15. 01. 2026", state: "overdue", premium: "48 000 Kč" },
  ];

  const COLUMNS = [
    { key: "code", label: "Číslo", sortable: true, width: "14%", render: (c) => e("span", { className: "s21-cell-code" }, c.code) },
    { key: "name", label: "Smlouva", sortable: true, width: "32%", render: (c) =>
      e("div", null,
        e("div", { className: "s21-cell-title" }, c.name),
        e("div", { className: "s21-cell-meta" }, c.client)
      )
    },
    { key: "validFrom", label: "Platnost od", width: "13%", numeric: true },
    { key: "validTo", label: "Platnost do", width: "13%", numeric: true },
    { key: "premium", label: "Pojistné", align: "right", numeric: true, width: "13%" },
    { key: "state", label: "Stav", width: "13%", render: (c) => e(S.WorkflowBadge, { state: c.state, fitCell: true }) },
    { key: "actions", label: "", align: "center", width: "4%", render: () =>
      e(S.Button, { size: "sm", iconOnly: true, icon: "more", "aria-label": "Víc", title: "Víc" })
    }
  ];

  const CRUMBS = [{ label: "DMS", href: "/dms" }, { label: "Smlouvy", href: "/dms/smlouvy" }];

  function Page() {
    const [chip, setChip] = React.useState("all");
    const [q, setQ] = React.useState("");
    return e(S.AppShell, {
      sidebar: e(D.DemoSidebar, { active: "/dms/smlouvy" }),
      topbar: e(D.DemoTopBar, { crumbs: CRUMBS }),
    },
      e(S.PageHeader, {
        title: "Smlouvy",
        description: "Pojistné, úvěrové a jiné smlouvy klientů",
        actions: e(React.Fragment, null,
          e(S.Button, { variant: "secondary", icon: "upload" }, "Importovat"),
          e(S.Button, { icon: "plus" }, "Nová smlouva")
        )
      }),
      e(S.PageBody, null,
        e(S.KpiRow, { cols: 4 },
          e(S.StatTile, { label: "Aktivních", value: "208" }),
          e(S.StatTile, { label: "Vyprší do 30 dnů", value: "3", accent: "warning" }),
          e(S.StatTile, { label: "Nepodepsaných", value: "2", accent: "danger" }),
          e(S.StatTile, { label: "Čeká na schválení", value: "4", accent: "primary" })
        ),
        e(S.ChipGroup, { value: chip, onChange: setChip, items: [
          { value: "all", label: "Všechny", count: 208 },
          { value: "pojisteni", label: "Pojištění", count: 142 },
          { value: "firemni", label: "Firemní", count: 38 },
          { value: "autopojisteni", label: "Autopojištění", count: 28 },
        ] }),
        e(S.FilterBar, null,
          e(S.SearchInput, { className: "s21-grow", value: q, onChange: setQ, placeholder: "Hledat číslo, klient, předmět…" }),
          e(S.Select, { placeholder: "Všechny stavy", options: [
            { value: "in-progress", label: "Platná" }, { value: "offer", label: "Nabídka" },
            { value: "negotiation", label: "V jednání" }, { value: "overdue", label: "Po termínu" }
          ] })
        ),
        e(S.DataTable, { columns: COLUMNS, rows: CONTRACTS, onRowClick: () => { window.location.href = "./dms-smlouva-detail.html"; }, minWidth: 980 })
      )
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(e(Page));
})();
</script>
</body>
</html>
