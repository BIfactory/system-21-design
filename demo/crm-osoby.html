<!doctype html>
<html lang="cs" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>System 21 · CRM Osoby</title>
<link rel="stylesheet" href="../tokens/tokens.css">
<link rel="stylesheet" href="../dist/system21.css">
<script>(function(){try{var b=localStorage.getItem('system21-brand');if(b&&b!=='bifactory')document.documentElement.setAttribute('data-brand',b);var t=localStorage.getItem('system21-theme');if(t==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
<script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="../dist/system21.js"></script>
<script src="./_shared.js"></script>
</head>
<body>
<div id="root"></div>
<script>
(() => {
  const S = window.S21, D = window.S21Demo, e = React.createElement;

  const PERSONS = [
    { id: 1, name: "Jan Novák", family: "Novákovi", phone: "+420 602 123 456", email: "jan@novak.cz", role: "Hlavní kontakt" },
    { id: 2, name: "Marie Nováková", family: "Novákovi", phone: "+420 602 987 654", email: "marie@novak.cz", role: "Manželka" },
    { id: 3, name: "Jana Nováková", family: "Novákovi", phone: "+420 605 111 222", email: "jana@novak.cz", role: "Dcera" },
    { id: 4, name: "Pavel Dvořák", family: "Dvořákovi", phone: "+420 608 234 567", email: "pavel@dvorak.cz", role: "Hlavní kontakt" },
    { id: 5, name: "Marcela Dvořáková", family: "Dvořákovi", phone: "+420 608 876 543", email: "marcela@dvorak.cz", role: "Manželka" },
    { id: 6, name: "Zuzana Svobodová", family: "Svobodovi", phone: "+420 603 111 222", email: "z.svobodova@gmail.com", role: "Hlavní kontakt" },
    { id: 7, name: "Tomáš Procházka", family: "Procházkovi", phone: "+420 605 333 444", email: "t.prochazka@seznam.cz", role: "Hlavní kontakt" },
    { id: 8, name: "Petr Král", family: "— (firma)", phone: "+420 724 555 777", email: "p.kral@moraviasteel.cz", role: "Jednatel Moravia Steel" },
  ];

  const COLUMNS = [
    { key: "name", label: "Jméno", sortable: true, width: "26%", render: (p) =>
      e("div", null,
        e("div", { className: "s21-cell-title" }, p.name),
        e("div", { className: "s21-cell-meta" }, p.role)
      )
    },
    { key: "family", label: "Klient", sortable: true, width: "20%" },
    { key: "phone", label: "Telefon", width: "22%" },
    { key: "email", label: "Mail", width: "25%" },
    { key: "actions", label: "", align: "center", width: "7%", render: () =>
      e("span", { className: "s21-row-actions", "data-no-row-click": true },
        e(S.Button, { size: "sm", iconOnly: true, icon: "phone", variant: "ghost", "aria-label": "Zavolat", title: "Zavolat" }),
        e(S.Button, { size: "sm", iconOnly: true, icon: "mail", variant: "ghost", "aria-label": "Mail", title: "Mail" })
      )
    }
  ];

  const CRUMBS = [{ label: "CRM", href: "/crm" }, { label: "Osoby", href: "/crm/osoby" }];

  function Page() {
    const [q, setQ] = React.useState("");
    return e(S.AppShell, {
      sidebar: e(D.DemoSidebar, { active: "/crm/osoby" }),
      topbar: e(D.DemoTopBar, { crumbs: CRUMBS }),
    },
      e(S.PageHeader, {
        title: "Osoby",
        description: "Fyzické osoby — rodinní členové a firemní kontakty",
        actions: e(S.Button, { icon: "user-plus" }, "Nová osoba")
      }),
      e(S.PageBody, null,
        e(S.KpiRow, { cols: 4 },
          e(S.StatTile, { label: "Celkem osob", value: "418" }),
          e(S.StatTile, { label: "Rodinní členové", value: "352" }),
          e(S.StatTile, { label: "Firemní kontakty", value: "66" }),
          e(S.StatTile, { label: "Nové tento měsíc", value: "12", accent: "success" })
        ),
        e(S.FilterBar, null,
          e(S.SearchInput, { className: "s21-grow", value: q, onChange: setQ, placeholder: "Hledat jméno, mail, telefon…" }),
          e(S.Select, { placeholder: "Všechny role", options: [
            { value: "hlavni", label: "Hlavní kontakt" }, { value: "manzel", label: "Manžel/ka" },
            { value: "dite", label: "Dítě" }, { value: "jiny", label: "Jiný" }
          ] })
        ),
        e(S.DataTable, { columns: COLUMNS, rows: PERSONS, onRowClick: () => { window.location.href = "./crm-klient-detail.html"; }, minWidth: 820 })
      )
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(e(Page));
})();
</script>
</body>
</html>
